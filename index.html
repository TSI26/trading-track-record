.mv-seg button[aria-checked="true"]{background:color-mix(in srgb,var(--mv) 18%,var(--surface-2));color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mv) 55%,transparent),inset 0 -2px 0 var(--mv)}
.panel.mov .field:focus{border-color:var(--mv)}
.mv-amount .field{font-size:24px;font-weight:700;padding:11px 44px 11px 14px}
.mv-amount .u{font-size:18px;font-weight:700;right:14px}
.panel.mov .save.mv-save{background:var(--mv);color:#fff;position:relative;transition:background .25s,filter .15s}
.panel.mov.mv-dep .save.mv-save{color:#fff}
.panel.mov.mv-ret .save.mv-save{color:var(--ret-ink)}
.mv-save:hover:not(:disabled){filter:brightness(1.06)}
.mv-save-in{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mv-check{width:18px;height:18px;flex:none}
.mv-save.loading .mv-check{display:none}
.mv-save.loading .mv-save-in::before{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.mv-save.done{filter:brightness(1.08)}
.mv-save.done .mv-check path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s ease-out forwards}
.mv-save.done .mv-check{transform:scale(1.15);transition:transform .2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
.mv-save:disabled{opacity:1;cursor:default}
/* ===== new trade window: two compact columns, everything visible at once ===== */
.panel.tr{max-width:1000px;padding:22px 28px 24px}
.tr-head{margin-bottom:10px;gap:12px}
.tr-head .tr-acc{width:auto;max-width:240px;margin-left:auto;margin-right:8px;padding:7px 10px}
.tr-title{display:flex;align-items:center;gap:11px}
.tr-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.panel.enter .tr-ico{animation:icoPop .45s cubic-bezier(.2,1.4,.4,1) .08s both}
@keyframes icoPop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.panel-sub .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tr-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 44px}
.tr-col{min-width:0}
.tsec{padding:16px 0 0}
.panel.enter .tsec{animation:secIn .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 50ms + 80ms)}
@keyframes secIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel.tr .fl{margin:14px 0 8px;font-size:12.5px}
.tsec > .fl:first-child,.tsec > div > .fl:first-child{margin-top:0}
.panel.tr .fl em{font-style:normal;font-weight:600;color:var(--accent);margin-left:6px}
.panel.tr .fl em.muted-em{color:var(--muted);font-weight:500}
.cls-grid,.sess-grid,.tf-row,.hold-row,.pick3,.res3,.side2{display:grid;gap:8px}
.cls-grid button,.sess-grid button,.tf-row button,.hold-row button,.pick3 button,.res3 button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 6px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;transition:border-color .15s,background .15s,color .15s,transform .12s;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls-grid button:hover,.sess-grid button:hover,.tf-row button:hover,.hold-row button:hover,.pick3 button:hover,.res3 button:hover{color:var(--fg);border-color:var(--line-2)}
.cls-grid button:active,.sess-grid button:active,.tf-row button:active,.hold-row button:active,.pick3 button:active,.res3 button:active,.side2 button:active,.stars button:active{transform:scale(.96)}
.cls-grid{grid-template-columns:repeat(6,minmax(0,1fr));margin-top:10px}
.cls-grid button{flex-direction:column;gap:3px;padding:8px 2px;font-size:11.5px}
.cls-grid .e{font-size:16px;line-height:1.1}
.cls-grid button[aria-pressed="true"],.sess-grid button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--bg));color:var(--fg);box-shadow:0 0 0 1px var(--c) inset}
.tf-row button[aria-pressed="true"],.hold-row button[aria-pressed="true"],.pick3 button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--bg));color:var(--fg);box-shadow:0 0 0 1px var(--accent) inset}
.asset-line{position:relative}
.asset-in{font-size:17px;font-weight:700;padding:11px 14px;letter-spacing:.02em}
.asset-in::placeholder{font-weight:500;letter-spacing:0}
.chips.recent{margin-top:10px}
.chips.recent:empty{display:none}
.chips.recent .chip{font-size:12px;padding:4px 10px}
.side2{grid-template-columns:1fr 1fr}
.side2 button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:13px;font-weight:800;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.side2 .arw{font-size:13px}
.side2 .long[aria-pressed="true"]{background:var(--win);border-color:var(--win);color:var(--win-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--win) 30%,transparent)}
.side2 .short[aria-pressed="true"]{background:var(--loss);border-color:var(--loss);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--loss) 30%,transparent)}
.side2 .long:not([aria-pressed="true"]):hover{color:var(--win);border-color:color-mix(in srgb,var(--win) 50%,var(--line))}
.side2 .short:not([aria-pressed="true"]):hover{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 50%,var(--line))}
.order-wrap{margin-top:10px;animation:secIn .25s ease-out}
.pick3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sess-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.sess-grid button{padding:10px 6px}
.sess-grid .e{font-size:15px}
.tf-row{grid-template-columns:1.15fr 1.15fr 1.3fr 1fr 1.1fr .7fr .7fr}
.tf-row{gap:6px}
.tf-row button{font-size:11.5px;padding:9px 0;letter-spacing:-.01em}
.hold-row{grid-template-columns:repeat(5,minmax(0,1fr))}
.hold-row button{flex-direction:column;gap:3px;padding:8px 2px;font-size:11.5px}
.hold-row .e{font-size:15px;line-height:1.2}
.tr-row{align-items:start}
.field.big{font-size:18px;font-weight:700;padding:10px 38px 10px 14px}
.stars{display:flex;gap:2px;margin-top:-2px}
.stars button{border:0;background:transparent;font-size:30px;line-height:1;padding:2px 3px;color:var(--line-2);cursor:pointer;transition:color .12s,transform .12s}
.stars button.on{color:#f5b301;text-shadow:0 0 14px color-mix(in srgb,#f5b301 45%,transparent)}
.stars button:hover{transform:scale(1.12)}
.res3{grid-template-columns:repeat(3,minmax(0,1fr))}
.res3 button{padding:10px 6px;font-size:13.5px}
.res3 .win[aria-pressed="true"]{border-color:var(--win);background:var(--win-soft);color:var(--fg);box-shadow:0 0 0 1px var(--win) inset}
.res3 .loss[aria-pressed="true"]{border-color:var(--loss);background:var(--loss-soft);color:var(--fg);box-shadow:0 0 0 1px var(--loss) inset}
.res3 .be[aria-pressed="true"]{border-color:var(--muted);background:var(--surface-2);color:var(--fg);box-shadow:0 0 0 1px var(--muted) inset}
#res-body{animation:secIn .25s ease-out}
.field.big.win{color:var(--win)} .field.big.loss{color:var(--loss)}
.panel.tr .field.big.win,.panel.tr .field.big.win:focus{border-color:var(--win);box-shadow:0 0 0 3px color-mix(in srgb,var(--win) 18%,transparent)}
.panel.tr .field.big.loss,.panel.tr .field.big.loss:focus{border-color:var(--loss);box-shadow:0 0 0 3px color-mix(in srgb,var(--loss) 18%,transparent)}
.panel.tr .field.big.be:focus{border-color:var(--muted)}
#t-pnl{padding-right:58px}
.res-mark{position:absolute;right:30px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;pointer-events:none;opacity:0;transform:scale(.4);transition:opacity .15s,transform .25s cubic-bezier(.2,1.4,.4,1)}
.res-mark.win{background:var(--win);color:var(--win-ink);opacity:1;transform:none}
.res-mark.loss{background:var(--loss);opacity:1;transform:none}
.res-mark.be{opacity:0}
.swap-line{display:flex;gap:5px}
.swap-line .sign-btn{width:36px;height:auto}
.panel.tr .row3{gap:10px;grid-template-columns:1.5fr 1fr 1fr}
.panel.tr .field.fee{font-size:13.5px;padding-top:9px;padding-bottom:9px}
.panel.tr .field.fee:not(:placeholder-shown){font-style:italic;color:var(--fg)}
.panel.tr .field.fee::placeholder{font-style:normal}
.checks{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px}
.checks .check{font-size:13px}
.checks .calc{margin:0 0 0 auto;font-size:12px}
.open-note{margin-top:12px;padding:10px 13px;border-radius:9px;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 40%,var(--line));font-size:12.5px;color:var(--muted)}
.open-note b{color:var(--fg)}
.tr-foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.tr-foot .err{min-height:0;margin:4px 0}
.tr-foot .err:empty{margin:0}
.panel.tr .save.tr-save{position:relative}
.tr-save.loading .tr-save-ico{display:none}
.tr-save.loading .mv-save-in::before{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.tr-save.done .tr-save-ico{display:inline-block;animation:icoPop .4s cubic-bezier(.2,1.4,.4,1)}
.tr-save:disabled{opacity:1;cursor:default}
.risk-fl{display:flex !important;align-items:baseline;justify-content:space-between}
.gpct{font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;transition:color .2s}
.gpct.over{color:var(--loss)}
.risk-line{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:start}
.gauge{padding:9px 14px 0 12px}
.g-track{position:relative;height:6px;border-radius:99px;background:var(--surface-2);margin:6px 0 0}
.g-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:var(--accent);transition:width .25s cubic-bezier(.2,.8,.3,1)}
.gauge.over .g-fill{background:var(--loss)}
.g-track input[type=range]{position:absolute;inset:-11px -10px;width:calc(100% + 20px);height:28px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;padding:0;box-sizing:border-box}
.g-track input[type=range]:focus{outline:none}
.g-track input[type=range]::-webkit-slider-runnable-track{background:transparent;height:28px}
.g-track input[type=range]::-moz-range-track{background:transparent}
.g-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:4px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),0 2px 6px rgba(0,0,0,.35);transition:transform .12s,box-shadow .15s}
.g-track input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff}
.g-track input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 22%,transparent),0 2px 6px rgba(0,0,0,.35)}
.g-track input[type=range]:active::-webkit-slider-thumb{transform:scale(1.1)}
.gauge.over input[type=range]::-webkit-slider-thumb{background:var(--loss);box-shadow:0 0 0 4px color-mix(in srgb,var(--loss) 22%,transparent)}
.gauge.off{opacity:.4;pointer-events:none}
.g-marks{position:relative;height:30px;margin-top:9px}
.g-marks button{position:absolute;top:0;transform:translateX(-50%);border:0;background:transparent;padding:10px 4px 2px;font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap;cursor:pointer;transition:color .15s}
.g-marks button::before{content:"";position:absolute;top:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--line-2);transition:background .15s,transform .15s}
.g-marks button.past::before{background:var(--accent)}
.g-marks button:hover{color:var(--fg)}
.g-marks button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.g-marks button[aria-pressed="true"]::before{transform:scale(1.5)}
.gauge.over .g-marks button.past::before{background:var(--loss)}
.conf-line{display:flex;align-items:center;gap:16px;margin-top:14px}
.conf-line .fl{margin:0 !important;min-width:150px}
#res-body > .fl:first-child{margin-top:16px}
#res-body .hold-row{margin-bottom:2px}
.panel.tr .fl em .muted-em{color:var(--muted);font-weight:500}
@media (max-width:900px){.m-desk .tr-cols{grid-template-columns:1fr}}
.m-phone .tr-cols{grid-template-columns:1fr}
.m-phone .cls-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.m-phone .tf-row{grid-template-columns:repeat(4,minmax(0,1fr))}
.m-phone .hold-row{grid-template-columns:repeat(3,minmax(0,1fr))}
.m-phone .tr-head .tr-acc{max-width:150px}
.m-phone .risk-line{grid-template-columns:110px minmax(0,1fr);gap:14px}
.m-phone .conf-line .fl{min-width:0}
.open-box{margin:4px 0 12px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface));border-radius:12px;padding:10px 12px}
.open-head{font-weight:700;font-size:13.5px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.open-head span{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11.5px;padding:1px 8px}
.open-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.open-row:first-of-type{border-top:0}
.open-asset{font-weight:700}
.open-meta{font-size:12.5px;color:var(--muted);flex:1;min-width:180px}
.open-stars{color:#f5b301;letter-spacing:1px}
.open-btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:8px;padding:6px 12px;font-size:13px}
/* small confirmation window */
.panel.small{max-width:520px}
.cf-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--loss-soft);margin-bottom:10px}
.cf-text{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.cf-text strong{color:var(--fg)}
.cf-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.cf-actions button{border-radius:10px;padding:11px 15px;font-weight:700;border:1px solid var(--line);background:transparent}
.cf-actions .danger{background:var(--loss);border-color:var(--loss);color:#fff}
.cf-actions .soft{background:var(--surface-2)}
/* deposits & withdrawals: aligned columns, no grid lines */
.mv-table{display:flex;flex-direction:column;margin:0 -8px}
.mv-tr{display:grid;grid-template-columns:88px 160px 100px 120px minmax(120px,240px) 72px;justify-content:start;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13.5px}
.mv-tr:not(.mv-th):hover{background:var(--surface-2)}
.mv-th{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding-top:2px;padding-bottom:6px}
.mv-tr .r{text-align:right}
.mv-accname{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mv-accname i{width:8px;height:8px;border-radius:50%;flex:none}
.mv-type{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.mv-type.dep{background:color-mix(in srgb,var(--dep) 14%,transparent);color:var(--dep);border:1px solid color-mix(in srgb,var(--dep) 35%,transparent)}
.mv-type.ret{background:color-mix(in srgb,var(--ret) 14%,transparent);color:var(--ret);border:1px solid color-mix(in srgb,var(--ret) 35%,transparent)}
.mv-body{display:flex;gap:24px;align-items:flex-start}
.mv-body > .mv-table,.mv-body > .empty-card{flex:1 1 auto;min-width:0}
.mvt{flex:0 0 300px;margin:0}
.mvt-boxes{display:grid;grid-template-columns:1fr;gap:10px}
.m-phone .mv-body{flex-direction:column-reverse;gap:14px}
.m-phone .mvt{flex:none;width:100%}
@media (max-width:1100px){.m-desk .mv-body{flex-direction:column-reverse}.m-desk .mvt{flex:none;width:100%}.m-desk .mvt-boxes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mvt-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mvt-box.dep{border-color:color-mix(in srgb,var(--dep) 30%,var(--line))}
.mvt-box.ret{border-color:color-mix(in srgb,var(--ret) 35%,var(--line))}
.mvt-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mvt-head em{margin-left:auto;font-style:normal;font-weight:500;font-size:11.5px}
.mvt-ico{font-size:15px}
.mvt-big{font-size:21px;font-weight:700;line-height:1.2}
.mvt-detail{font-size:12px;color:var(--muted)}
.mvt-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--muted)}
.mvt-line strong{font-size:16px;font-weight:700;color:var(--fg)}

.mvt-conv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.mvt-conv .seg button{font-size:12.5px;padding:5px 10px}
.mvt-conv small{font-size:12px}
.m-phone .mvt-boxes{grid-template-columns:1fr !important}
.mv-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mv-btns{display:flex;gap:4px;justify-content:flex-end}
.mv-btn{width:32px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;font-size:14px;padding:0;opacity:.75;transition:opacity .15s,background .15s,border-color .15s}
.mv-tr:hover .mv-btn{opacity:1}
.mv-btn:hover{background:var(--surface);border-color:var(--line-2)}
.mv-btn.mvdel:hover{background:var(--loss-soft);border-color:color-mix(in srgb,var(--loss) 50%,transparent)}
.mv-amt{font-weight:700}
.mv-note{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-phone .mv-tr{grid-template-columns:auto 1fr auto auto;gap:4px 10px}
.m-phone .mv-tr > :nth-child(6){grid-column:4;grid-row:1 / 3}
.m-phone .mv-th{display:none}
.m-phone .mv-tr > :nth-child(2){grid-column:2}
.m-phone .mv-tr > :nth-child(3){grid-column:1;grid-row:2}
.m-phone .mv-tr > :nth-child(4){grid-column:3;grid-row:1}
.m-phone .mv-tr > :nth-child(5){grid-column:2 / 4;grid-row:2;font-size:12px}
.mov-list{list-style:none;margin:0;padding:0}
.mov-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.mov-list li:last-child{border-bottom:0}

/* settings */
.set-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.set-block h3{margin:0 0 4px;font-family:var(--font-display);font-size:16px}
.set-block p{margin:0 0 12px;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:13px}
.tag button{border:0;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;padding:0}
.tag button:hover{background:var(--loss-soft);color:var(--loss)}
.inline-add{display:flex;gap:8px;max-width:420px}

/* ===== panels ===== */
.overlay{position:fixed;inset:0;background:rgba(3,5,10,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,6vh) 16px 16px;overflow:auto}
.m-desk .panel{max-height:none}
.m-phone .overlay{align-items:flex-end;padding:0}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:16px;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.m-phone .panel{border-radius:18px 18px 0 0;max-height:94vh}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panel-head h2{margin:0;font-family:var(--font-display);font-size:19px}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.f-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between;gap:10px}
.f-label em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toggle2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.toggle2 button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.toggle2 button.on-w{background:var(--win);color:var(--win-ink)}
.toggle2 button.on-l{background:var(--loss);color:#fff}
.toggle2 button.on-n{background:var(--fg);color:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
.field:focus{border-color:var(--accent)}
.field.n{font-family:var(--font-num)}
.big-amt{display:flex;align-items:center;gap:8px}
.big-amt .field{font-family:var(--font-num);font-size:22px;font-weight:700;padding:8px 12px}
.sign-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;width:46px;height:46px;font-family:var(--font-num);font-size:20px;font-weight:700;flex:none}
.calc{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.calc strong{color:var(--fg);font-family:var(--font-num)}
.err{color:var(--loss);font-size:13.5px;min-height:20px;margin-top:10px}
.panel-actions{display:flex;gap:10px;margin-top:4px}
.save{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.del{border:1px solid var(--line);background:transparent;border-radius:12px;padding:13px 16px;font-weight:700;color:var(--loss)}
.confirm{margin-top:10px;padding:12px;border-radius:10px;background:var(--loss-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.confirm .grow{min-width:160px}
.confirm button{border:0;border-radius:9px;padding:8px 12px;font-weight:700}
.confirm .yes{background:var(--loss);color:#fff}
.confirm .no{background:var(--surface-2)}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
details.more summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;padding:8px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.m-phone .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){
  .panel.enter{animation:up .22s cubic-bezier(.2,.8,.3,1)}
  .overlay.enter{animation:fadein .18s ease-out}
  @keyframes up{from{transform:translateY(16px) scale(.985);opacity:0}to{transform:none;opacity:1}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .overlay.leaving{animation:fadeout .2s ease-in forwards}
  .overlay.leaving .panel{animation:down .2s ease-in forwards}
  @keyframes fadeout{to{opacity:0}}
  @keyframes down{to{transform:translateY(10px) scale(.97);opacity:0}}
}
/* window buttons: they answer the mouse */
.overlay .x{color:var(--muted);transition:background .18s,color .18s,transform .12s}
.overlay .x svg{transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.overlay .x:hover{background:var(--loss-soft);color:var(--loss)}
.overlay .x:hover svg{transform:rotate(90deg)}
.overlay .x:active{transform:scale(.9)}
.overlay .cancel{color:var(--muted);transition:background .18s,border-color .18s,color .18s,transform .12s}
.overlay .cancel:hover{color:var(--fg);border-color:var(--line-2);background:var(--surface-2)}
.overlay .cancel:active{transform:scale(.97)}
.overlay .del{transition:background .18s,border-color .18s,transform .12s}
.overlay .del:hover{background:var(--loss-soft);border-color:color-mix(in srgb,var(--loss) 55%,var(--line))}
.overlay .del:active{transform:scale(.95)}
.overlay .save{--btn-c:var(--accent);transition:filter .18s,transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,background .25s}
.panel.mov .save{--btn-c:var(--mv)}
.overlay .save:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 10px 22px -8px color-mix(in srgb,var(--btn-c) 70%,transparent)}
.overlay .save:not(:disabled):active{transform:translateY(0) scale(.985);box-shadow:none;transition-duration:.08s}
.tr-save-ico{display:inline-block;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.overlay .save:not(:disabled):hover .tr-save-ico{transform:rotate(-12deg) scale(1.2)}

body{padding-bottom:env(safe-area-inset-bottom,0px)}
.m-desk .side{padding-top:calc(20px + env(safe-area-inset-top,0px))}
.icon-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.ptop-right{display:flex;align-items:center;gap:8px}
.logout{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:4px 6px;text-align:left}
.logout:hover{color:var(--fg)}

/* admin */
.view-flag{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px;padding:11px 15px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:13.5px}
.view-flag button{margin-left:auto;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;padding:7px 13px}
.users-table td .see{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 11px;font-weight:600}
.users-table tr.me td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.tag-me{font-size:10.5px;font-weight:700;color:var(--accent);margin-left:8px;text-transform:uppercase;letter-spacing:.06em}
.u-cards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.u-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}
.u-card .u-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.u-card .u-mail{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== login ===== */
.auth{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth-show{position:relative;overflow:hidden;padding:44px clamp(32px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:36px;
  background:
    linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 48px,
    linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 100%,
    var(--surface);border-right:1px solid var(--line)}
.auth-show::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 20% 10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),linear-gradient(180deg,transparent 40%,var(--surface) 100%);pointer-events:none}
.auth-show > *{position:relative;z-index:1}
.auth-show h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(34px,3.6vw,54px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance;max-width:14ch}
.auth-show h2 em{font-style:normal;color:var(--accent)}
.auth-show .lead{margin:14px 0 0;color:var(--muted);font-size:15.5px;max-width:44ch}
.show-card{background:color-mix(in srgb,var(--bg) 78%,transparent);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:470px;backdrop-filter:blur(6px);box-shadow:var(--shadow)}
.show-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.show-stats div span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.show-stats div strong{font-family:var(--font-num);font-size:19px}
.show-card svg{display:block;width:100%;height:110px}
.show-points{display:flex;flex-wrap:wrap;gap:8px}
.show-points span{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);border:1px solid var(--line)}
.auth-side{display:grid;place-items:center;padding:40px 24px calc(40px + env(safe-area-inset-bottom,0px))}
.auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:15px}
.auth-logo{display:none;align-items:center;gap:12px;justify-content:center;margin-bottom:4px}
.auth-card h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:27px;line-height:1.1}
.auth-card .sub{margin:-6px 0 0;color:var(--muted);font-size:14px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px}
.auth-tabs button{border:0;background:transparent;border-radius:8px;padding:9px;font-weight:700;color:var(--muted)}
.auth-tabs button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.a-field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.a-field .field{font-size:16px;padding:12px 14px;background:var(--surface)}
.pw{position:relative}
.pw .field{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.eye:hover{color:var(--fg);background:var(--surface-2)}
.eye svg{width:19px;height:19px}
.a-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--fg);cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.a-link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.a-link:hover{text-decoration:underline}
.auth-card .primary{width:100%;padding:14px;font-size:16px}
.a-hint{font-size:12.5px;color:var(--muted);margin-top:-8px}
.auth-msg{font-size:14px;min-height:20px;line-height:1.4}
.auth-msg.err{color:var(--loss)} .auth-msg.ok{color:var(--win)}
.auth-msg:empty{display:none}
.auth-note{font-size:12.5px;color:var(--muted);margin:0;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.a-back{align-self:flex-start}
@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-show{display:none}
  .auth-logo{display:flex}
  .auth-side{align-items:start;padding-top:calc(48px + env(safe-area-inset-top,0px))}
  .auth-card h1,.auth-card .sub,.auth-msg{text-align:center}
}

/* ---------- trade maths ----------
   net     = gross result − commission + swap        (in the account currency)
   riskR   = risk / R-MAX                             (how much of the R-MAX was risked: 0.5 R)
   rTrade  = net / risk                               (R/Trade: the reward-to-risk obtained on the position: +5 R)
   rReal   = net / R-MAX                              (R réel: what the trade really added, in R-MAX units: +2.5 R)
   Without an R-MAX, the trade's own risk counts as 1 R. */
function enrich(t, beR) {
  const net = round2(t.pnl - t.commission + t.swap);
  const riskR = t.rmax > 0 && t.risk > 0 ? t.risk / t.rmax : null;
  const rTrade = t.risk > 0 ? net / t.risk : null;
  const rReal = t.rmax > 0 ? net / t.rmax : rTrade;
  let res = t.resKind === 'be' ? 'be' : net > 0 ? 'win' : net < 0 ? 'loss' : 'be';
  if (beR > 0 && rReal != null && Math.abs(rReal) <= beR) res = 'be';
  return {...t, net, riskR, rTrade, rReal, res};
}

async function onAuthSubmit(e) {

    }
    if (m === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) throw error;
    } else if (m === 'signup') {
      const {data: d, error} = await sb.auth.signUp({email, password: pass, options: {emailRedirectTo: appUrl()}});
      if (error) throw error;

    } else if (m === 'forgot') {

      if (error) throw error;
      authMode = 'login';
      return showAuth('Si un compte existe avec cette adresse, un e-mail vient de partir. Ouvre le lien qu’il contient pour choisir un nouveau mot de passe (regarde aussi dans les indésirables).', 'ok');
    } else if (m === 'recovery') {

      if (state.store !== 'cloud') { state.store = 'cloud'; fetchAll(); checkAdmin(); startRealtime(); }

/* ---------- charts ---------- */
function baseOpts(c) {
  const muted = css('--muted'), line = css('--line');
  const font = {family: "'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif", size: 11.5};
  return {
    maintainAspectRatio: false, animation: {duration: 250},
    interaction: {mode: 'index', intersect: false},
    plugins: {legend: {display: false}, tooltip: {backgroundColor: css('--surface-2'), borderColor: line, borderWidth: 1, titleColor: css('--fg'), bodyColor: css('--fg'), padding: 10, bodyFont: {family: "'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif", size: 12}, titleFont: {family: "'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif", size: 12, weight: '600'}}},
    scales: {
      x: {grid: {display: false}, ticks: {color: muted, font, maxRotation: 0, autoSkip: true, maxTicksLimit: 8}, border: {color: line}},
      y: {grid: {color: line}, border: {display: false}, ticks: {color: muted, font, callback: v => fVshort(v, c), maxTicksLimit: 6}}
    }
  };
}
function gradientFill(color) {
  return ctx2 => { const ch = ctx2.chart, area = ch.chartArea; const g = ch.ctx.createLinearGradient(0, area ? area.top : 0, 0, area ? area.bottom : 240); g.addColorStop(0, color + '44'); g.addColorStop(1, color + '00'); return g; };
}
function drawEquity(id, list, c) {
  const el = document.getElementById(id); if (!el || !list.length) return;
  let cum = 0; const values = [0];
  list.forEach(t => { cum += val(t, c); values.push(round2(cum)); });
  const accent = css('--accent');
  const o = baseOpts(c);
  o.scales.x.ticks.callback = (v, i) => i === 0 ? '0' : String(i);
  o.plugins.tooltip.callbacks = {
    title: items => { const i = items[0].dataIndex; if (!i) return 'Départ'; const t = list[i - 1]; return `Trade n°${i} · ${fmtDate(t.date)} · ${t.asset}`; },
    label: x => { const i = x.dataIndex; if (!i) return ' Cumul : 0'; return [` Trade : ${fV(val(list[i - 1], c), c)}`, ` Cumul : ${fV(x.parsed.y, c)}`]; }
  };
  charts.push(new Chart(el, {type: 'line', data: {labels: values.map((_, i) => i), datasets: [{data: values, borderColor: accent, borderWidth: 2, tension: 0.15, fill: true, backgroundColor: gradientFill(accent), pointRadius: values.map((_, i) => i === values.length - 1 ? 4 : 0), pointHoverRadius: 5, pointBackgroundColor: accent}]}, options: o}));
}
function drawDrawdown(id, list, c) {
  const el = document.getElementById(id); if (!el || !list.length) return;
  let cum = 0, peak = 0; const values = [0];
  list.forEach(t => { cum += val(t, c); peak = Math.max(peak, cum); values.push(round2(cum - peak)); });
  const loss = css('--loss');
  const o = baseOpts(c);
  o.scales.x.ticks.callback = (v, i) => String(i);
  o.scales.y.max = 0;
  o.plugins.tooltip.callbacks = {title: items => items[0].dataIndex ? `Après le trade n°${items[0].dataIndex}` : 'Départ', label: x => ` Sous le plus haut : ${fV(x.parsed.y, c)}`};
  charts.push(new Chart(el, {type: 'line', data: {labels: values.map((_, i) => i), datasets: [{data: values, borderColor: loss, borderWidth: 1.5, tension: 0.1, fill: 'origin', backgroundColor: loss + '33', pointRadius: 0, pointHoverRadius: 4}]}, options: o}));
}
function monthList(list) {
  const out = [];
  if (state.period === 'month') { for (let k = 11; k >= 0; k--) { const d = new Date(state.cy, state.cm - k, 1); out.push([d.getFullYear(), d.getMonth()]); } }
  else if (state.period === 'year') { for (let m = 0; m < 12; m++) out.push([state.cy, m]); }
  else {
    if (!list.length) return out;
    const first = list[0].date, last = list[list.length - 1].date > todayStr() ? list[list.length - 1].date : todayStr();
    let d = new Date(+first.slice(0, 4), +first.slice(5, 7) - 1, 1);
    const end = new Date(+last.slice(0, 4), +last.slice(5, 7) - 1, 1);
    while (d <= end) { out.push([d.getFullYear(), d.getMonth()]); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
    while (out.length > 36) out.shift();
  }
  return out;
}
function drawMonths(id, list, c) {
  const el = document.getElementById(id); if (!el) return;
  const months = monthList(list);
  const vals = months.map(([y, m]) => { const k = `${y}-${pad(m + 1)}`; return round2(list.filter(t => t.date.startsWith(k)).reduce((a, t) => a + val(t, c), 0)); });
  const counts = months.map(([y, m]) => { const k = `${y}-${pad(m + 1)}`; return list.filter(t => t.date.startsWith(k)).length; });
  const win = css('--win'), loss = css('--loss');
  const o = baseOpts(c);
  o.plugins.tooltip.callbacks = {label: x => [` Résultat : ${fV(x.parsed.y, c)}`, ` ${counts[x.dataIndex]} trade${counts[x.dataIndex] > 1 ? 's' : ''}`]};
  charts.push(new Chart(el, {type: 'bar', data: {labels: months.map(([y, m]) => monthShort(y, m)), datasets: [{data: vals, backgroundColor: vals.map(v => v >= 0 ? win : loss), borderRadius: 4, maxBarThickness: 30}]}, options: o}));
}
const R_BUCKETS = [[-Infinity, -1.5, '< −1,5'], [-1.5, -1, '−1,5 à −1'], [-1, -0.5, '−1 à −0,5'], [-0.5, 0, '−0,5 à 0'], [0, 0.5, '0 à 0,5'], [0.5, 1, '0,5 à 1'], [1, 2, '1 à 2'], [2, 3, '2 à 3'], [3, 5, '3 à 5'], [5, Infinity, '> 5']];
function drawHisto(id, list, c) {

  charts.push(new Chart(el, {type: 'bar', data: {labels: R_BUCKETS.map(b => b[2]), datasets: [{data: counts, backgroundColor: R_BUCKETS.map(b => b[1] <= 0 ? loss : win), borderRadius: 4, maxBarThickness: 34}]}, options: o}));

/* ---------- breakdown table (label · trades · win rate · diverging bar · result) ---------- */
function breakdown(groups, c, sortBy = 'total') {
  const rows = groups.filter(g => g.list.length).map(g => {
    const s = stats(g.list, c);
    return {...g, n: s.n, wr: s.winrate, total: s.total};
  });
  if (!rows.length) return `<div class="empty-card">Pas encore de données.</div>`;
  if (sortBy === 'total') rows.sort((a, b) => b.total - a.total);
  const max = Math.max(...rows.map(r => Math.abs(r.total)), 1e-9);
  return `<div class="brk">
    <div class="brk-row head"><span>&nbsp;</span><span class="r">Trades</span><span class="r">Réussite</span><span></span><span class="r">Résultat</span></div>
    ${rows.map(r => `<div class="brk-row" title="${esc(r.label)} : ${r.n} trades, ${fPct(r.wr)} de réussite, ${esc(fV(r.total, c))}">
      <span class="lbl">${r.color ? `<i style="background:${r.color}"></i>` : ''}${esc(r.label)}</span>
      <span class="r num">${r.n}</span>
      <span class="r num">${fPct(r.wr)}</span>
      <span class="dtrack"><span class="dfill ${r.total >= 0 ? 'p' : 'n'}" style="width:calc(${Math.abs(r.total) / max * 50}% - 1px)"></span></span>
      <span class="r num ${sgnCls(r.total)}">${fV(r.total, c)}</span>
    </div>`).join('')}
  </div>`;
}
const groupBy = (list, keyFn) => { const m = new Map(); list.forEach(t => { const k = keyFn(t); if (k == null) return; if (!m.has(k)) m.set(k, []); m.get(k).push(t); }); return m; };

function calendarHtml(c) {

  const byDay = {};

        <span class="d">${day}</span><span class="v">${fVshort(v, c)}</span><span class="n">${l.length} trade${l.length > 1 ? 's' : ''}</span></div>`;

  }
  return `<div class="card-head" style="margin-bottom:10px">
      <div><h3 style="text-transform:capitalize">${monthName(y, m)}</h3><p class="hint" style="margin:0">${ms.n ? `<span class="num ${sgnCls(ms.total)}">${fV(ms.total, c)}</span> · ${ms.n} trades · ${fPct(ms.winrate)} de réussite` : 'Aucun trade ce mois-ci'}</p></div>

    </div>

}

function readImport(input, d) {

  rows.slice(h.at + 1).forEach((r, i) => {
    const g = k => col[k] == null ? '' : String(r[col[k]] ?? '').trim();
    const line = h.at + i + 2, num = k => impNum(g(k));

    const k = impPick(CLASSES, g('cls'), ['id', 'name', 'one']) || (CLS_ALIAS[nrm(g('cls'))] ? classOf(CLS_ALIAS[nrm(g('cls'))]) : null);
    const raw = g('asset');

    const asset = formatAsset(raw, cls);

    if (!asset) return bad.push({line, why: 'actif manquant'});
    if (!side) return bad.push({line, why: 'sens manquant (Long ou Short)'});
    if (!(risk > 0)) return bad.push({line, why: 'risque manquant'});
    if (!open && !isFinite(pnl)) return bad.push({line, why: 'résultat manquant'});
    if (g('cur')) curs.add(g('cur').toUpperCase());
    const se = impPick(SESSIONS, g('session'), ['id', 'name']) || (/^l/i.test(g('session')) ? sessionOf('london') : /^n/i.test(g('session')) ? sessionOf('ny') : /^a/i.test(g('session')) ? sessionOf('asia') : null);
    const on = nrm(g('order'));
    const tf = impPick(TIMEFRAMES, g('tf'), ['id', 'name']), hn = nrm(g('hold')), ho = impPick(HOLDINGS, g('hold'), ['id', 'name']) || (/^scalp/.test(hn) ? {id: 'scalp'} : /^intrad|^day/.test(hn) ? {id: 'day'} : /^intraw|^week/.test(hn) ? {id: 'week'} : /^intram|^month/.test(hn) ? {id: 'month'} : /^swing/.test(hn) ? {id: 'swing'} : null);
    const time = (g('time').match(/^(\d{1,2}):(\d{2})/) || []).slice(1).map((x, j) => j ? x : x.padStart(2, '0')).join(':');
    trades.push({line, date, time, asset, asset_class: cls, side, session: se ? se.id : 'off', risk: round2(risk), rmaxIn: num('rmax'),

      setup: g('setup'), note: g('note'), order: /limit/.test(on) ? 'limit' : /stop/.test(on) ? 'stop' : /march|market/.test(on) ? 'market' : '',
      tf: tf ? tf.id : '', hold: ho ? ho.id : '', conf: Math.max(0, Math.min(5, parseInt(g('conf'), 10) || 0)), open, resKind: !open && /^b/.test(issue) ? 'be' : ''});
  });

const impKey = t => [t.date, t.time || '', t.asset, t.side, Math.round((t.pnl || 0) * 100), Math.round((t.risk || 0) * 100)].join('|');
function importPlan(f, d) {

// totals: three boxes (deposited, withdrawn, net), one line per currency
function movTotals(list, c) {
  const mf = state.movFilter || 'all'; // "Dépôts" or "Retraits" alone: only the matching box
  const by = {};
  let nd = 0, nr = 0;
  list.forEach(m => { const cur = accCur(c, m.account_id); const o = by[cur] ||= {dep: 0, ret: 0}; if (m.kind === 'depot') { o.dep += m.amount; nd++; } else { o.ret += m.amount; nr++; } });
  const curs = Object.keys(by).sort((a, b) => a === 'USD' ? -1 : b === 'USD' ? 1 : a === 'EUR' ? -1 : b === 'EUR' ? 1 : a.localeCompare(b));
  const conv = '';
  const sum = key => {
    if (!conv) return null;
    let t = 0;
    for (const cur of curs) { const v = convert(by[cur][key], cur, conv); if (v == null) return null; t += v; }
    return t;
  };
  const box = (cls, icon, label, key, count, sign) => {
    const total = key === 'net' ? (conv ? (sum('dep') == null ? null : sum('dep') - sum('ret')) : null) : sum(key);
    const val = cur => key === 'net' ? by[cur].dep - by[cur].ret : by[cur][key];
    // amounts stay neutral: + for money in, − for money out (green/red are kept for trading results)
    const fmt = (v, cur) => key === 'net' ? money(v, cur, true) : (v ? (sign ? '−' : '+') : '') + money(v, cur);
    const lines = curs.map(cur => `<div class="mvt-line"><span>${cur}</span><strong class="num">${fmt(val(cur), cur)}</strong></div>`).join('');
    return `<div class="mvt-box ${cls}">
      <div class="mvt-head"><span class="mvt-ico">${icon}</span><span>${label}</span>${count != null ? `<em>${count}</em>` : ''}</div>
      ${conv && total != null
        ? `<div class="mvt-big num ${sign && total ? 'neg' : key === 'net' && total < 0 ? 'neg' : ''}">${(sign && total ? '−' : '') + money(total, conv)}</div><div class="mvt-detail">${(() => { const parts = curs.filter(cur => val(cur)).map(cur => money(key === 'net' ? val(cur) : Math.abs(val(cur)), cur)); return parts.length > 1 ? 'soit ' + parts.join(' et ') : parts.length === 1 && !(parts[0].includes(curSym(conv))) ? 'soit ' + parts[0] : '&nbsp;'; })()}</div>`
        : curs.length === 1 ? `<div class="mvt-big num">${fmt(val(curs[0]), curs[0])}</div>` : lines}
    </div>`;
  };
  return `<div class="mvt">
    <div class="mvt-boxes">
      ${mf !== 'depot' ? box('ret', '💸', 'Total retiré', 'ret', `${nr} retrait${nr > 1 ? 's' : ''}`, true) : ''}
      ${mf !== 'retrait' ? box('dep', '💰', 'Total déposé', 'dep', `${nd} dépôt${nd > 1 ? 's' : ''}`, false) : ''}
      ${mf === 'all' ? box('net', '🧮', 'Net apporté', 'net', null, false) : ''}
    </div>
  </div>`;
}

function shrinkImage(file, size = 192) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Ce fichier n’est pas une image.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const cv = document.createElement('canvas'); cv.width = cv.height = size;
      cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible : essaie avec une photo JPG ou PNG.')); };
    img.src = url;
  });
}
async function setAvatar(file) {
  try { const data = await shrinkImage(file); await saveSettings({avatar: data}); toast('Photo de profil mise à jour'); }
  catch (e) { toast(e.message || 'Impossible de lire cette image.'); }
}
async function changeEmail() {
  const email = prof.email.trim();
  prof.msgE = null;
  if (!/^\S+@\S+\.\S+$/.test(email)) { prof.msgE = {kind: 'err', text: 'Indique une adresse e-mail valide.'}; return profRender(); }
  if (email.toLowerCase() === String(state.myEmail).toLowerCase()) { prof.msgE = {kind: 'err', text: 'C’est déjà ton adresse actuelle.'}; return profRender(); }
  prof.busyE = true; profRender();
  try {
    const {error} = await sb.auth.updateUser({email}, {emailRedirectTo: appUrl()});
    if (error) throw error;
    prof.email = '';
    prof.msgE = {kind: 'ok', text: `Un lien de confirmation vient de partir vers ${email} (regarde aussi dans les indésirables). Ton adresse changera après ton clic.`};
  } catch (e) { prof.msgE = {kind: 'err', text: authError(e)}; }
  prof.busyE = false; profRender();
}
async function changePassword() {
  prof.msgP = null;
  if (!prof.cur) { prof.msgP = {kind: 'err', text: 'Indique ton mot de passe actuel.'}; return profRender(); }
  if (prof.n1.length < 6) { prof.msgP = {kind: 'err', text: 'Le nouveau mot de passe doit faire au moins 6 caractères.'}; return profRender(); }
  if (prof.n1 !== prof.n2) { prof.msgP = {kind: 'err', text: 'Les deux nouveaux mots de passe ne sont pas identiques.'}; return profRender(); }
  if (prof.n1 === prof.cur) { prof.msgP = {kind: 'err', text: 'Choisis un mot de passe différent de l’actuel.'}; return profRender(); }
  prof.busyP = true; profRender();
  try {
    const chk = await sb.auth.signInWithPassword({email: state.myEmail, password: prof.cur});
    if (chk.error) { prof.msgP = {kind: 'err', text: /Invalid login/i.test(chk.error.message || '') ? 'Ton mot de passe actuel est incorrect.' : authError(chk.error)}; }
    else {
      const {error} = await sb.auth.updateUser({password: prof.n1});
      if (error) throw error;
      prof.cur = prof.n1 = prof.n2 = '';
      prof.msgP = {kind: 'ok', text: 'Mot de passe modifié. Utilise le nouveau à ta prochaine connexion.'};
    }
  } catch (e) { prof.msgP = {kind: 'err', text: authError(e)}; }
  prof.busyP = false; profRender();
}

// captures still in the storage space but no longer on the page (they can be put back)
const lostChecked = new Set();
async function findLostImages(t) {
  if (readOnly() || state.store !== 'cloud' || lostChecked.has(t.id)) return;
  lostChecked.add(t.id);
  try {
    const have = new Set((t.imgs || []).map(x => x.p)), lost = (await storedImages(t.id)).filter(x => !have.has(x.p));
    if (!lost.length || state.view !== 'fiche' || state.ficheId !== t.id) return;
    const box = $('#fi-pics'); if (!box || $('#fi-lost')) return;
    box.insertAdjacentHTML('afterbegin', `<div class="fi-lost" id="fi-lost"><span>🔎 <b>${lost.length} capture${lost.length > 1 ? 's' : ''}</b> de ce trade ${lost.length > 1 ? 'ont été retrouvées' : 'a été retrouvée'} dans ton espace.</span><button type="button" class="primary" id="fi-lost-btn">Les remettre sur la page</button></div>`);
    $('#fi-lost-btn').addEventListener('click', async () => {
      const cur = data().trades.find(x => x.id === t.id); if (!cur) return;
      const room = Math.max(0, FI_MAX - (cur.imgs || []).length), back = lost.slice(0, Math.max(room, lost.length));
      await saveFiche(t.id, {imgs: [...(cur.imgs || []), ...back.map(x => ({p: x.p, w: 0, h: 0, s: x.s}))]});
      toast(`${back.length} capture${back.length > 1 ? 's' : ''} remise${back.length > 1 ? 's' : ''} 👍`); render();
    });
  } catch (e) {}
}
function autoGrow(n) { n.style.height = 'auto'; n.style.height = Math.max(n.classList.contains('fi-text') && n.id === 'fi-explain' ? 220 : 140, n.scrollHeight + 2) + 'px'; }

function fiSaveState() {

// notes are saved by themselves, a moment after you stop typing
async function saveFiche(id, patch) {

  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLib ||= new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxLib = null; ko(new Error('lecteur Excel non chargé (connexion ?)')); }; document.head.appendChild(s); });

async function readExcel(file, d) {
  const X = await loadXlsx();
  const wb = X.read(await file.arrayBuffer(), {type: 'array', cellNF: true});
  const pad = n => String(n).padStart(2, '0');
  let best = null;
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name]; if (!ws || !ws['!ref']) continue;
    const R = X.utils.decode_range(ws['!ref']), rows = [];
    for (let r = R.s.r; r <= R.e.r; r++) {
      const row = [];
      for (let k = R.s.c; k <= R.e.c; k++) {
        const cell = ws[X.utils.encode_cell({r, c: k})];
        if (!cell) { row.push(''); continue; }
        if (cell.t === 'n' && cell.z && X.SSF.is_date(cell.z)) { const p = X.SSF.parse_date_code(cell.v); row.push(p ? (p.H || p.M ? `${p.y}-${pad(p.m)}-${pad(p.d)} ${pad(p.H)}:${pad(p.M)}` : `${p.y}-${pad(p.m)}-${pad(p.d)}`) : ''); }
        else if (cell.t === 'n') row.push(String(cell.v));
        else if (cell.t === 'd') row.push(cell.v.toISOString().slice(0, 10));
        else row.push(String(cell.w ?? cell.v ?? ''));
      }
      rows.push(row);
    }
    const res = readImport(rows, d);
    if (!res.err && (!best || res.trades.length > best.trades.length)) best = res;
  }
  return best || {err: 'Aucun onglet de ce fichier ne contient un tableau de trades reconnaissable (colonnes « Date », « Actif » et « Long/Short »).'};
}
async function openImport(file) {

  try {
    if (/\.xls[xm]?$/i.test(file.name)) read = await readExcel(file, c.d);
    else {
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) text = new TextDecoder('windows-1252').decode(buf); // CSV saved by Excel on Windows

  if (ds.cal) { const d = new Date(state.calY, state.calM + +ds.cal, 1); state.calY = d.getFullYear(); state.calM = d.getMonth(); render(); return; }
  if (ds.accview) { setSel([ds.accview]); go('stats'); return; }
  if (ds.accdel) { const a = ctx().d.accounts.find(x => x.id === ds.accdel); if (a) confirmDeleteAccount(a); return; }
  if (ds.accedit) { const a = ctx().d.accounts.find(x => x.id === ds.accedit); if (a) openAccount(a); return; }
  if (ds.movnew != null && !form) return openMovement(null, ds.movnew);
  if (ds.movdelete) return confirmDeleteMovement(ds.movdelete);
  if (ds.movfilter) { state.movFilter = ds.movfilter; render(); return; }
  if (ds.movedit) { const m = ctx().d.movements.find(x => x.id === ds.movedit); if (m) { if (readOnly()) return toast('Lecture seule.'); openMovement(m); } return; }
  if (ds.fiche && !form) { openFiche(ds.fiche); return; }
  if (ds.trdel && !form) { const tr = data().trades.find(x => x.id === ds.trdel); if (tr) confirmDeleteTrade(tr); return; }
  if (ds.trclose && !form) { const tr = data().trades.find(x => x.id === ds.trclose); if (tr) openTrade(tr, {closeOnly: true}); return; }
  if (ds.trcard) { toast('La fiche du trade arrive bientôt 🙂'); return; }
  if (ds.edit && !form) { const tr = data().trades.find(x => x.id === ds.edit); if (tr) openTrade(tr); return; }
  if (!form) return;
  if (ds.cact && form.kind === 'confirm') { const fn = form.onPick; closePanel(); if (ds.cact !== 'cancel' && fn) await fn(ds.cact); return; }
  if (t.hasAttribute('data-close')) return closePanelSoft();
  if (t.hasAttribute('data-save')) return panelSave();
  if (t.hasAttribute('data-del')) { if (form.kind === 'account') { const a = ctx().d.accounts.find(x => x.id === form.id); if (a) confirmDeleteAccount(a); return; } form.confirm = true; return drawPanel(); }
  if (t.hasAttribute('data-noconf')) { form.confirm = false; if (form.kind === 'account') return syncAccountForm(); return drawPanel(); }
  if (t.hasAttribute('data-yesconf')) return panelDelete();
  if (form.kind === 'trade' && !form.busy) {
    if (ds.tcls) { form.asset_class = ds.tcls; if (form.asset) { form.asset = formatAsset(form.asset, form.asset_class); const ai = $('#t-asset'); if (ai) ai.value = form.asset; } syncTradeForm(); $('#t-asset')?.focus(); return; }
    if (ds.tasset) { form.asset = ds.tasset; const ai = $('#t-asset'); if (ai) ai.value = ds.tasset; return syncTradeForm(); }
    if (ds.tside) { form.side = ds.tside; return syncTradeForm(); }
    if (ds.torder) { form.order = ds.torder; return syncTradeForm(); }
    if (ds.tsess) { form.session = ds.tsess; form.sessAuto = false; return syncTradeForm(); }
    if (ds.ttf) { form.tf = ds.ttf; return syncTradeForm(); }
    if (ds.thold) { form.hold = ds.thold; return syncTradeForm(); }
    if (ds.trisk) { setRiskPct(+ds.trisk); return; }
    if (ds.tconf) { form.conf = +ds.tconf; return syncTradeForm(); }
    if (ds.tres) { form.resKind = form.resKind === ds.tres ? '' : ds.tres; if (form.pnlStr && form.resKind !== 'be') { form.pnlStr = pnlFix(String(form.pnlStr).replace(/[-−]/g, ''), form.resKind); const pi = $('#t-pnl'); if (pi) pi.value = form.pnlStr; } syncTradeForm(); if (form.resKind) setTimeout(() => $('#t-pnl')?.focus(), 30); return; }
    if (t.hasAttribute('data-tdel')) { const tr = ctx().d.trades.find(x => x.id === form.id); if (tr) confirmDeleteTrade(tr); return; }
  }
  if (ds.akind) { form.akind = ds.akind; return syncAccountForm(); }
  if (ds.aphase) { form.prop_phase = ds.aphase; return syncAccountForm(); }
  if (ds.acolor) { form.color = ds.acolor; return syncAccountForm(); }
  if (ds.acur) { if (ds.acur !== 'other') { form.currency = ds.acur; form.moreCur = false; } return syncAccountForm(); }
  if (t.hasAttribute('data-acurmore')) { form.moreCur = !form.moreCur; syncAccountForm(); if (form.moreCur) $('#a-cur-more')?.focus(); return; }
  if (ds.mkind) { if (!form.busy) form.mkind = ds.mkind; return syncMovForm(); }
  if (t.hasAttribute('data-movdel')) return confirmDeleteMovement(form.id);
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.acccheck) { toggleAccShown(e.target.dataset.acccheck, e.target.checked, ctx()); }
  if (e.target.matches && e.target.matches('[data-accall]')) {
    const c = ctx(), act = c.d.accounts.filter(a => !a.archived);
    // unticking "Tous" keeps only the first account, since at least one must stay shown
    setSel(e.target.checked ? 'all' : [(act[0] || c.d.accounts[0]).id]);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.accMenuOpen) { state.accMenuOpen = false; renderSwitcher(ctx()); document.querySelector('[data-act="accmenu"]')?.focus(); return; }
  if (e.key === 'Escape' && state.menuOpen) { state.menuOpen = false; renderMe(); document.querySelector('[data-act="memenu"]')?.focus(); return; }
  if (e.key === 'Escape' && form) closePanelSoft();
  if (e.key === 'Enter' && e.target.matches) {
    if (e.target.matches('tr.row')) { const tr = data().trades.find(x => x.id === e.target.dataset.edit); if (tr) openTrade(tr); }
    if (e.target.matches('li[data-movedit], [data-accone]')) e.target.click();
    if (e.target.id === 'new-setup') { e.preventDefault(); document.querySelector('[data-act="addsetup"]')?.click(); }
  }
});

const mq = window.matchMedia('(prefers-color-scheme: dark)');
const rerender = () => { if (['dash', 'stats'].includes(state.view)) render(); };
mq.addEventListener?.('change', rerender);
new MutationObserver(rerender).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
let rz; window.addEventListener('resize', () => { if (state.menuOpen) { state.menuOpen = false; renderMe(); } if (state.accMenuOpen) { state.accMenuOpen = false; renderSwitcher(ctx()); } clearTimeout(rz); rz = setTimeout(() => { applyMode(); if (state.view === 'dash' || state.view === 'stats') charts.forEach(ch => ch.resize()); }, 150); });

$('#avatar-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) setAvatar(f); });
render();
initStore();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
})();
</script>
