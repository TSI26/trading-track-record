<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Track-Record">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Trading Track-Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Same skeleton as Tracking by Wealth: two modes (desk = sidebar + grid + spreadsheet; phone = narrow column + bottom bar + sheet).
   Look: trading terminal. Near-black surfaces, amber accent, green/red for P&L, monospace figures. */
:root{
  --bg:#0b0e14; --surface:#11151d; --surface-2:#181d27; --line:#232a37; --line-2:#2e3746;
  --fg:#e7eaf0; --muted:#8b94a7; --accent:#f5a524; --accent-ink:#1a1204;
  --win:#22c55e; --win-soft:rgba(34,197,94,.13); --win-ink:#04210f;
  --loss:#f2545b; --loss-soft:rgba(242,84,91,.13);
  --be:#8b94a7;
  --dep:#4b94ec; --ret:#e8b04a; --ret-ink:#2a1d04;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --font-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f0f2f6; --line:#e0e4eb; --line-2:#cfd5df;
    --fg:#10141c; --muted:#5b6578; --accent:#c77a00; --accent-ink:#ffffff;
    --win:#11905a; --win-soft:rgba(17,144,90,.10); --win-ink:#ffffff;
    --loss:#d93a42; --loss-soft:rgba(217,58,66,.09);
    --be:#5b6578;
    --dep:#2a78d6; --ret:#b7791f; --ret-ink:#ffffff;
    --dep:#2a78d6; --ret:#b7791f; --ret-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6;
    --shadow:0 8px 24px rgba(20,30,60,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f0f2f6; --line:#e0e4eb; --line-2:#cfd5df;
  --fg:#10141c; --muted:#5b6578; --accent:#c77a00; --accent-ink:#ffffff;
  --win:#11905a; --win-soft:rgba(17,144,90,.10); --win-ink:#ffffff;
  --loss:#d93a42; --loss-soft:rgba(217,58,66,.09);
  --be:#5b6578;
  --dep:#2a78d6; --ret:#b7791f; --ret-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6;
  --shadow:0 8px 24px rgba(20,30,60,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1,'zero' 0}
.kpi .k-val,.acc-bal,.side-bal strong,.big-amt .field,.field.n,.qf.n,.slist li strong,.cal .cell .v,.calc strong,.acc-grid strong,.show-stats div strong{font-variant-numeric:tabular-nums lining-nums}
.pos{color:var(--win)} .neg{color:var(--loss)} .zero{color:var(--muted)}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap;text-transform:uppercase}
.brand .logo{width:28px;height:28px;flex:none}
.brand b{color:var(--accent);font-weight:700}
.brand .sub{display:block;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:-2px}

/* mode switch */
.mode-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.mode-switch button{border:0;background:transparent;border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:12.5px}
.mode-switch button svg{width:16px;height:16px;flex:none}
.mode-switch button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* ===== shared pieces ===== */
.banner{margin-bottom:16px;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13.5px}
.banner.warn{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--fg)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.seg button:disabled{opacity:.4;cursor:default}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav .label{font-family:var(--font-display);font-weight:600;font-size:15px;min-width:130px;text-align:center;text-transform:capitalize}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13.5px;max-width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px}
.ghost:hover{border-color:var(--line-2)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:10px}
.primary:disabled{opacity:.6;cursor:default}

.kpis{display:grid;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.kpi .k-val{font-family:var(--font-num);font-weight:700;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.kpi .k-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hero{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface) 65%);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}

.grid{display:grid;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-width:0}
.card h3{margin:0 0 2px;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.card .hint{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0}
.chart-box{position:relative;height:250px}
.empty-card{text-align:center;padding:26px 16px;color:var(--muted);font-size:13.5px}

/* stats list */
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.slist li:last-child{border-bottom:0}
.slist li span:first-child{color:var(--muted)}
.slist li strong{font-family:var(--font-num);font-weight:600}

/* diverging breakdown rows */
.brk{display:flex;flex-direction:column}
.brk-row{display:grid;grid-template-columns:minmax(76px,1.3fr) 42px 50px minmax(20px,1.2fr) minmax(84px,auto);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.brk-row:last-child{border-bottom:0}
.brk-row.head{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-top:0}
.brk-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:8px}
.brk-row .lbl i{width:8px;height:8px;border-radius:2px;flex:none}
.brk-row .r{text-align:right}
.dtrack{position:relative;height:12px}
.dtrack::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.dfill{position:absolute;top:0;bottom:0;border-radius:3px}
.dfill.p{left:calc(50% + 1px);background:var(--win)}
.dfill.n{right:calc(50% + 1px);background:var(--loss)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.05fr);gap:4px}
.cal .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.cal .cell{min-height:62px;border-radius:8px;background:var(--surface-2);border:1px solid transparent;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.cal .cell.out{background:transparent}
.cal .cell.today{border-color:var(--accent)}
.cal .cell .d{font-size:11px;color:var(--muted);font-weight:600}
.cal .cell .v{font-family:var(--font-num);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .cell .n{font-size:10.5px;color:var(--muted)}
.cal .cell.wk{background:transparent;border:1px dashed var(--line)}
.cal .cell.has{cursor:default}

.h-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.search{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 11px}
.search input{border:0;background:transparent;padding:8px 0;width:100%;outline:none}
.h-summary{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.welcome{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 26px;display:grid;gap:14px;justify-items:start}
.welcome h2{margin:0;font-family:var(--font-display);font-size:27px;line-height:1.12;text-wrap:balance;max-width:24ch}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.welcome .row{display:flex;flex-wrap:wrap;gap:10px}
.flag{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.flag button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.pill.long{background:var(--win-soft);color:var(--win)}
.pill.short{background:var(--loss-soft);color:var(--loss)}
.pill.kind{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ===== DESKTOP MODE ===== */
.app{min-height:100vh}
.m-desk{--sidew:248px}
.m-desk.side-mini{--sidew:68px}
.m-desk .app{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1)}
.side{display:none}
.m-desk .side{display:flex;position:sticky;top:0;height:100vh;padding:20px 12px 14px;border-right:1px solid var(--line);background:var(--surface);flex-direction:column;gap:18px;z-index:20;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
/* while the rail shrinks, the texts fade out and get clipped; icons never move */
.side .lbl{white-space:nowrap;transition:opacity .18s ease .1s}
.m-desk.side-mini .side .lbl{opacity:0;transition-delay:0s}
.side .brand{padding-left:6px;font-size:15px;gap:10px;letter-spacing:0;white-space:nowrap;min-height:30px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav button{border:0;background:transparent;padding:9px 13px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:12px;text-align:left;white-space:nowrap}
.side-nav button svg{width:18px;height:18px;flex:none}
.side-nav button:hover{background:var(--surface-2);color:var(--fg)}
.side-nav button[aria-current="page"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.side-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 14px;border-radius:9px;display:flex;align-items:center;justify-content:flex-start;gap:11px;white-space:nowrap;overflow:hidden}
.side-add svg{flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-bal{padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;white-space:nowrap;transition:opacity .18s ease .1s}
.m-desk.side-mini .side-bal{opacity:0;pointer-events:none;transition-delay:0s}
.side-bal span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.side-bal strong{font-family:var(--font-num);font-size:18px}
.side-bal small{font-size:12px;color:var(--muted)}
.side .mode-switch button{flex:1;justify-content:center;padding:6px 4px;font-size:12px;gap:4px}
.m-desk.side-mini .side .mode-switch{flex-direction:column}
.m-desk.side-mini .side .mode-switch .lbl{display:none}
/* open / close button, sitting on the sidebar's edge line */
.side-toggle{display:none;position:fixed;top:22px;left:calc(var(--sidew) - 12px);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);place-items:center;z-index:30;padding:0;opacity:.6;transition:left .32s cubic-bezier(.4,0,.2,1),opacity .2s,color .15s,border-color .15s}
.m-desk .side-toggle{display:grid}
.m-desk .side:hover + .side-toggle{opacity:.85}
.side-toggle:hover,.side-toggle:focus-visible{opacity:1 !important;color:var(--fg);border-color:var(--line-2)}
.side-toggle svg{width:12px;height:12px;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.m-desk.side-mini .side-toggle svg{transform:rotate(180deg)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group + .nav-group{margin-top:14px}
.nav-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:0 13px 6px;opacity:.75}
.m-desk.side-mini .nav-title.lbl{opacity:0}
.me-btn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 5px;text-align:left;white-space:nowrap;overflow:hidden;transition:background .2s,border-color .2s}
.me-btn:hover{border-color:var(--line-2)}
.me-btn .me-chev{width:16px;height:16px;color:var(--muted);flex:none;margin-right:4px}
.m-desk.side-mini .me-btn{border-color:transparent;background:transparent}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--loss)));color:var(--accent-ink);flex:none;text-transform:uppercase;line-height:1;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:17px;height:17px}
.avatar.lg{width:72px;height:72px;font-size:28px}
.me-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.me-txt b{font-size:13.5px}
.me-txt small{font-size:11.5px;color:var(--muted)}
.me-menu{position:fixed;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60;width:220px}
.me-menu button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-weight:600;color:var(--fg);text-align:left}
.me-menu button:hover,.me-menu button:focus-visible{background:var(--surface-2)}
.me-menu button svg{width:17px;height:17px;color:var(--muted);flex:none}
.me-menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.me-menu .danger,.me-menu .danger svg{color:var(--loss)}
@media (prefers-reduced-motion:no-preference){ .me-menu.enter{animation:pop .14s ease-out} @keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}} }
.ptop .me-btn{width:auto;padding:0;border:0;background:transparent}
.tip{position:fixed;z-index:70;background:var(--fg);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);transform:translateY(-50%)}
/* editable photo */
.avatar-edit{position:relative;border:0;background:none;padding:0;border-radius:50%;flex:none;cursor:pointer}
.avatar-edit .pen{position:absolute;inset:0;border-radius:50%;background:rgba(5,8,14,.5);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .15s}
.avatar-edit .pen svg{width:20px;height:20px}
.avatar-edit:hover .pen,.avatar-edit:focus-visible .pen{opacity:1}
.me-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 5px;white-space:nowrap;overflow:hidden;transition:background .2s,border-color .2s}
.me-card:hover{border-color:var(--line-2)}
.me-card .me-btn{border:0;background:transparent;padding:4px 2px;flex:1;min-width:0;border-radius:6px}
.me-card .avatar-edit .pen svg{width:14px;height:14px}
.m-desk.side-mini .me-card{border-color:transparent;background:transparent}
.m-desk.side-mini .me-card .avatar-edit .pen{display:none}
.link-del{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.link-del:hover{color:var(--loss)}

/* ===== top bar (computer) ===== */
.topbar{display:none}
.m-desk .topbar{display:flex;position:sticky;top:0;z-index:15;height:64px;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.tb-title{font-family:var(--font-display);font-weight:700;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-right{display:flex;align-items:center;gap:10px;flex:none}
.tb-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 15px;border-radius:9px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tb-add:hover{filter:brightness(1.06)}
.topbar .acc-sw{width:250px;padding:5px 9px 5px 5px;background:var(--surface)}
.m-desk .page-head h1{display:none}
.m-desk .page-head{justify-content:flex-end}
.m-desk .page-head:not(:has(> :nth-child(2))){display:none}
@media (max-width:860px){.m-desk .topbar{padding:0 16px}.topbar .acc-sw-txt small{display:none}}

/* ===== account switcher ===== */
.acc-sw{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 7px;text-align:left;white-space:nowrap;overflow:hidden;transition:border-color .15s,background .2s}
.acc-sw:hover,.acc-sw[aria-expanded="true"]{border-color:var(--line-2)}
.acc-sw-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.acc-sw-txt b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.acc-sw-txt small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.acc-chev{width:16px;height:16px;color:var(--muted);flex:none}
.acc-sw-bal{flex:none;font-weight:700;font-size:13px;padding-left:8px;border-left:1px solid var(--line);color:var(--fg)}
.topbar .acc-sw{width:248px;gap:8px;padding:4px 7px 4px 4px}
.topbar .acc-badge{width:28px;height:28px;font-size:13px}
.topbar .acc-sw-txt b{font-size:13px}
.topbar .acc-sw-txt small{font-size:11px}
.sub-bal{display:none}
.ptop .acc-sw-bal{display:none}
.ptop .acc-sw-txt small:has(.sub-bal) .sub-full{display:none}
.ptop .sub-bal{display:inline}
.acc-badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-family:var(--font-display);font-weight:700;font-size:14px;color:#fff;background:var(--c,var(--muted));text-transform:uppercase;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.acc-badge.sm{width:28px;height:28px;font-size:13px}
.acc-badge.empty{background:var(--surface);border:1px dashed var(--line-2);color:var(--muted);text-shadow:none}
.acc-badge.all{background:var(--surface);border:1px solid var(--line-2);color:var(--fg);text-shadow:none}
.acc-badge.all svg{width:15px;height:15px}
.ptop .acc-wrap{min-width:0;flex:1}
.ptop .acc-sw{width:auto;max-width:100%;background:transparent;border-color:transparent;padding:4px 6px 4px 2px}
.acc-menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:300px;max-height:min(70vh,560px);overflow:auto}
@media (prefers-reduced-motion:no-preference){.acc-menu.enter{animation:pop .14s ease-out}}
.acc-menu-head{display:flex;flex-direction:column;padding:6px 8px 8px}
.acc-menu-head span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.acc-menu-head small{font-size:11.5px;color:var(--muted);opacity:.8}
.acc-row{display:flex;align-items:center;gap:10px;border-radius:9px;padding:7px 8px;cursor:pointer;user-select:none}
.acc-row:hover{background:var(--surface-2)}
.acc-row.arch{opacity:.6}
.acc-row-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.acc-row-txt b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row-txt small{font-size:11.5px;color:var(--muted)}
.acc-chk{display:grid;place-items:center;width:34px;height:34px;margin:-6px -4px -6px 0;border-radius:8px;flex:none;cursor:pointer}
.acc-chk:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.acc-chk input{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer}
.acc-div{border-top:1px solid var(--line);margin:4px 6px}
.acc-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:10px 8px 4px}
.acc-menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.acc-foot{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-weight:600;color:var(--fg);text-align:left}
.acc-foot:hover{background:var(--surface-2)}
.acc-foot svg{width:17px;height:17px;color:var(--muted)}

/* ===== account window ===== */
.panel.wide{max-width:640px}
.panel-sub{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.req{color:var(--accent);font-weight:700}
.fsec{border-top:1px solid var(--line);padding-top:4px;margin-top:12px}
.fsec:first-of-type{border-top:0;margin-top:2px;padding-top:0}
.fsec[hidden]{display:none}
.fsec-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin:12px 0 0}
.fsec-title em{font-style:normal;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.fl em{font-style:normal;font-weight:500;opacity:.85}
.fhint{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.segbar{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.segbar button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 10px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.segbar button:hover{color:var(--fg)}
.segbar button[aria-checked="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2),inset 0 -2px 0 var(--accent)}
.segbar button b{font-weight:700;margin-right:2px}
.cur-line{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.cur-seg{flex:0 1 auto}
.cur-seg button[data-acurmore]{flex:0 0 auto;padding:8px 12px;font-size:16px;line-height:1;letter-spacing:1px}
.cur-line select{flex:1 1 200px;width:auto}
.inp-unit{position:relative}
.inp-unit .field{padding-right:34px}
.inp-unit .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;font-size:13px;pointer-events:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0;box-shadow:inset 0 0 0 2px var(--surface);transition:transform .12s}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-checked="true"]{border-color:var(--fg)}
.cancel{border:1px solid var(--line);background:transparent;border-radius:12px;padding:13px 18px;font-weight:700}
.save:disabled{opacity:.6;cursor:default}
.m-phone .row3{grid-template-columns:1fr 1fr}
.m-phone .segbar button{padding:8px 6px;font-size:13px}
/* account page */
.prof-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prof-head h2{margin:0;font-family:var(--font-display);font-size:21px}
.prof-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.prof-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));margin-top:10px}
.prof-form{display:flex;flex-direction:column;gap:10px;max-width:440px}
.prof-form .a-field .field{font-size:15px;padding:10px 12px;background:var(--bg)}
.prof-msg{font-size:13.5px;line-height:1.4}
.prof-msg.err{color:var(--loss)} .prof-msg.ok{color:var(--win)}
.prof-msg:empty{display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.m-desk .wrap{width:100%;max-width:1520px;margin:0 auto;padding-inline:28px;padding-block:24px 60px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-bottom:16px}
.page-head h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1}
.page-head h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}

.m-desk .kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.m-desk .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
.m-desk .s3{grid-column:span 3}.m-desk .s4{grid-column:span 4}.m-desk .s5{grid-column:span 5}.m-desk .s6{grid-column:span 6}
.m-desk .s7{grid-column:span 7}.m-desk .s8{grid-column:span 8}.m-desk .s12{grid-column:span 12}
.m-desk .tall .chart-box{height:300px}
@media (max-width:1250px){
  .m-desk .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .m-desk .s3,.m-desk .s4{grid-column:span 6}
  .m-desk .s5,.m-desk .s7,.m-desk .s8{grid-column:span 12}
}
@media (max-width:860px){
  .m-desk .wrap{padding-inline:16px}
  .m-desk .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m-desk .s3,.m-desk .s4,.m-desk .s6{grid-column:span 12}
}

/* spreadsheet table */
.sheet-table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;margin-top:12px;max-height:calc(100vh - 230px)}
table.tx-table{width:100%;border-collapse:collapse;font-size:13px}
table.journal{min-width:1380px}
.tx-table th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tx-table th.r,.tx-table td.r{text-align:right}
.tx-table td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tx-table td + td,.tx-table th + th{border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.tx-table tbody tr.row{cursor:pointer}
.tx-table tbody tr.row:hover td{background:var(--surface-2)}
.tx-table .note{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tx-table .asset{font-weight:700;font-family:var(--font-num)}
.month-row td{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:7px 10px}
.month-row td span{float:right;text-transform:none;letter-spacing:0}
tr.quick td{background:color-mix(in srgb,var(--accent) 6%,var(--surface));padding:6px 4px;border-bottom:2px solid var(--accent);position:sticky;top:33px;z-index:1}
tr.quick td:first-child{padding-left:8px}
tr.quick td:last-child{padding-right:8px}
.qf{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 7px;outline:none;min-width:0;font-size:13px}
.qf:focus{border-color:var(--accent)}
.qf.n{text-align:right;font-family:var(--font-num)}
.q-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:7px;padding:6px 12px;white-space:nowrap}
.q-hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.q-err{color:var(--loss);font-weight:600}

/* ===== PHONE MODE ===== */
.ptop{display:none}
.m-phone .ptop{display:block;position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ptop-inner{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptop .brand{font-size:15px}
.ptop .mode-switch button{padding:6px 8px}
.ptop .mode-switch button span{display:none}
.m-phone .wrap{max-width:520px;margin:0 auto;padding-inline:14px;padding-block:14px 120px}
.m-phone .page-head{margin-bottom:12px}
.m-phone .page-head h1{font-size:22px}
.m-phone .page-head h1 small{display:none}
.m-phone .filters{width:100%}
.m-phone .filters .select{flex:1 1 140px}
.m-phone .kpis{grid-template-columns:1fr 1fr}
.m-phone .kpi.hero{grid-column:1/-1}
.m-phone .kpis .kpi:last-child{grid-column:1/-1}
.m-phone .kpi.hero .k-val{font-size:30px}
.m-phone .kpi .k-val{font-size:20px}
.m-phone .grid{grid-template-columns:minmax(0,1fr)}
.m-phone .desk-only{display:none !important}
.m-desk .phone-only{display:none !important}
.m-phone .cal .cell{min-height:46px;padding:4px}
.m-phone .cal .cell .n{display:none}
.m-phone .cal .cell .v{font-size:10px}
.m-phone .brk-row{grid-template-columns:minmax(0,1fr) 34px 44px minmax(0,1fr) 78px;gap:7px;font-size:12.5px}

.day{margin-top:14px}
.day-head{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:0 4px 6px}
.day-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:10px 13px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface-2)}
.grow{flex:1;min-width:0}
.t-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.t-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-amt{text-align:right;white-space:nowrap}
.t-amt div:first-child{font-weight:700}
.t-amt div:last-child{font-size:12px}

.mnav{display:none}
.m-phone .mnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.mnav-inner{max-width:520px;margin:0 auto;padding-inline:8px;display:flex;justify-content:space-between;align-items:center}
.mtab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);width:68px}
.mtab[aria-selected="true"]{color:var(--accent)}
.mtab svg{width:22px;height:22px}
.fab{border:0;width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow)}

/* more menu (phone) and account cards */
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list button{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:600;text-align:left}
.menu-list button svg{width:20px;height:20px;color:var(--muted)}
.acc-cards{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.acc-cards .acc-card{flex:0 1 400px;min-width:330px}
.m-phone .acc-cards .acc-card{flex:1 1 100%;min-width:0}
.acc-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.acc-card.archived{opacity:.6}
.acc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acc-name{font-family:var(--font-display);font-weight:700;font-size:17px}
.acc-broker{font-size:12.5px;color:var(--muted)}
.acc-bal{font-family:var(--font-num);font-weight:700;font-size:24px}
.acc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acc-grid div{background:var(--surface-2);border-radius:8px;padding:7px 9px;min-width:0}
.acc-grid span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.acc-grid strong{font-family:var(--font-num);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.acc-actions{margin-top:auto;padding-top:4px;display:grid;grid-template-columns:auto 1fr auto 40px;gap:6px}
.acc-act{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s,background .15s}
.acc-act:hover{border-color:var(--line-2);background:color-mix(in srgb,var(--fg) 6%,var(--surface-2))}
.acc-act.del{padding:9px 0;font-size:14px}
.acc-act.del:hover{border-color:color-mix(in srgb,var(--loss) 60%,var(--line));background:var(--loss-soft)}
.acc-add-cell{display:flex;align-items:flex-start;padding:14px 4px;flex:none}
.acc-add{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s,filter .15s}
.acc-add:hover{transform:scale(1.07);filter:brightness(1.05)}
.acc-add svg{width:22px;height:22px}
/* deposit / withdrawal window */
.panel.mov{max-width:500px;border:1.5px solid var(--mv,var(--line));transition:border-color .25s,box-shadow .25s;box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--mv) 12%,transparent)}
.panel.mv-dep{--mv:var(--dep)}
.panel.mv-ret{--mv:var(--ret)}
.mv-head{margin-bottom:12px}
.mv-title{display:flex;align-items:center;gap:10px}
.mv-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--mv) 16%,transparent);transition:background .25s}
.mv-acc{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.mv-bal{font-weight:700;font-size:14px}
.mv-seg button[aria-checked="true"]{background:color-mix(in srgb,var(--mv) 18%,var(--surface-2));color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mv) 55%,transparent),inset 0 -2px 0 var(--mv)}
.panel.mov .field:focus{border-color:var(--mv)}
.mv-amount .field{font-size:24px;font-weight:700;padding:11px 44px 11px 14px}
.mv-amount .u{font-size:18px;font-weight:700;right:14px}
.panel.mov .save.mv-save{background:var(--mv);color:#fff;position:relative;transition:background .25s,filter .15s}
.panel.mov.mv-dep .save.mv-save{color:#fff}
.panel.mov.mv-ret .save.mv-save{color:var(--ret-ink)}
.mv-save:hover:not(:disabled){filter:brightness(1.06)}
.mv-save-in{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mv-check{width:18px;height:18px;flex:none}
.mv-save.loading .mv-check{display:none}
.mv-save.loading .mv-save-in::before{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.mv-save.done{filter:brightness(1.08)}
.mv-save.done .mv-check path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s ease-out forwards}
.mv-save.done .mv-check{transform:scale(1.15);transition:transform .2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
.mv-save:disabled{opacity:1;cursor:default}
/* ===== new trade window ===== */
.panel.tr{max-width:680px}
.tr-head{margin-bottom:6px}
.tr-title{display:flex;align-items:center;gap:12px}
.tr-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.panel.enter .tr-ico{animation:icoPop .45s cubic-bezier(.2,1.4,.4,1) .08s both}
@keyframes icoPop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.panel-sub .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tsec{padding:12px 0 2px;border-top:1px solid var(--line)}
.tsec:first-of-type{border-top:0}
.panel.enter .tsec{animation:secIn .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 55ms + 90ms)}
@keyframes secIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tsec .fl:first-child{margin-top:0}
.tsec .fl em{font-style:normal;font-weight:600;color:var(--accent);margin-left:6px}
/* generic pick buttons */
.cls-grid,.sess-grid,.tf-row,.hold-row,.pick3,.res3,.side2{display:grid;gap:6px}
.cls-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.cls-grid button,.sess-grid button,.tf-row button,.hold-row button,.pick3 button,.res3 button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px;font-weight:600;font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,background .15s,color .15s,transform .12s;min-width:0;white-space:nowrap}
.cls-grid button:hover,.sess-grid button:hover,.tf-row button:hover,.hold-row button:hover,.pick3 button:hover,.res3 button:hover{color:var(--fg);border-color:var(--line-2)}
.cls-grid button:active,.sess-grid button:active,.tf-row button:active,.hold-row button:active,.pick3 button:active,.res3 button:active,.side2 button:active,.stars button:active{transform:scale(.96)}
.cls-grid button{flex-direction:column;gap:3px;padding:9px 4px;font-size:12px}
.cls-grid .e{font-size:19px;line-height:1}
.cls-grid button[aria-pressed="true"],.sess-grid button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--bg));color:var(--fg);box-shadow:0 0 0 1px var(--c) inset}

.open-box{margin:4px 0 12px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface));border-radius:12px;padding:10px 12px}

.m-phone .mvt-boxes{grid-template-columns:1fr !important}

<script>
(() => {
/* =====================================================================
   TRADING TRACK-RECORD
   Same technical base as Tracking by Wealth (Supabase auth + RLS + realtime, admin, PWA, desk/phone modes).
   Content: trading accounts (multi-currency), trades measured against R-MAX, deposits/withdrawals, stats.
   ===================================================================== */

/* ---------- reference data ---------- */
const CLASSES = [
  {id:'forex', name:'Forex', one:'Forex', emoji:'💱', color:'var(--s1)', ph:'EUR/USD'},
  {id:'indices', name:'Indices', one:'Indice', emoji:'📈', color:'var(--s3)', ph:'NAS100'},
  {id:'actions', name:'Actions', one:'Action', emoji:'🏢', color:'var(--s2)', ph:'AAPL'},
  {id:'matieres', name:'Commodités', one:'Commodité', emoji:'🛢️', color:'var(--s4)', ph:'XAU/USD'},
  {id:'crypto', name:'Crypto', one:'Crypto', emoji:'🪙', color:'var(--s6)', ph:'BTC/USD'},
  {id:'etf', name:'ETF', one:'ETF', emoji:'🧺', color:'var(--s5)', ph:'SPY'},
  {id:'autre', name:'Autre', one:'Autre', emoji:'❔', color:'var(--muted)', ph:''}
];
// what you type → how it is written. Pairs (forex, crypto, metals) get a slash: eurusd → EUR/USD
const QUOTES = ['USDT', 'USDC', 'USD', 'EUR', 'GBP', 'JPY', 'CHF', 'CAD', 'AUD', 'NZD', 'BTC', 'ETH'];
function formatAsset(raw, cls) {
  const s = String(raw || '').toUpperCase().replace(/[^A-Z0-9.]/g, '');
  if (!s) return '';
  if (cls === 'forex' && /^[A-Z]{6}$/.test(s)) return s.slice(0, 3) + '/' + s.slice(3);
  if (cls === 'crypto' || cls === 'matieres') {
    const q = QUOTES.find(q => s.length > q.length && s.endsWith(q) && /^[A-Z0-9]+$/.test(s.slice(0, -q.length)));
    if (q) return s.slice(0, -q.length) + '/' + q;
  }
  return s;
}
const ORDER_TYPES = [{id:'market', name:'Marché', emoji:'⚡'}, {id:'limit', name:'Limit', emoji:'🎯'}, {id:'stop', name:'Stop', emoji:'🚦'}];
const orderLabel = (order, side) => order === 'market' ? 'Au marché' : order ? (side === 'short' ? 'Sell ' : 'Buy ') + (order === 'limit' ? 'Limit' : 'Stop') : '';
const TIMEFRAMES = [{id:'m1', name:'1–5 min'}, {id:'m6', name:'6–15 min'}, {id:'m20', name:'20–45 min'}, {id:'h1', name:'1–4 H'}, {id:'h8', name:'8 H–1 D'}, {id:'w', name:'W'}, {id:'mo', name:'M'}];
const HOLDINGS = [{id:'scalp', name:'Scalping', emoji:'⚡', hint:'30 min max'}, {id:'day', name:'IntraDay', emoji:'☀️', hint:'1 jour max'}, {id:'week', name:'IntraWeek', emoji:'📅', hint:'5 jours max'}, {id:'month', name:'IntraMonth', emoji:'🗓️', hint:'30 jours max'}, {id:'swing', name:'Swing', emoji:'🌊', hint:'plus de 30 jours'}];
const CONF_LABELS = ['Choisis ta confiance', 'Très faible', 'Faible', 'Moyenne', 'Bonne', 'Totale'];
const classOf = id => CLASSES.find(c => c.id === id) || CLASSES[CLASSES.length - 1];
const SESSIONS = [
  {id:'asia', name:'Asie', emoji:'🌏', color:'#9085e9'},
  {id:'london', name:'Londres', emoji:'🇬🇧', color:'#3987e5'},
  {id:'ny', name:'New York', emoji:'🗽', color:'#e5673a'},
  {id:'off', name:'Hors session', emoji:'🌙', color:'#8b94a7'}
];
const sessionOf = id => SESSIONS.find(s => s.id === id) || SESSIONS[3];
const KINDS = [
  {id:'reel', name:'Réel', plural:'Comptes réels'},
  {id:'demo', name:'Démo', plural:'Comptes démo'},
  {id:'prop', name:'Prop firm', plural:'Prop firms'},
  {id:'backtest', name:'Backtest', plural:'Backtests'}
];
const kindOf = id => KINDS.find(k => k.id === id) || KINDS[0];
const CURRENCIES = ['USD','EUR','GBP','CHF','CAD','AUD','JPY','NZD','SGD','HKD','SEK','NOK','DKK','PLN','ZAR','MXN','TRY','AED','CNH'];
const CUR_NAMES = {USD:'Dollar américain', EUR:'Euro', GBP:'Livre sterling', CHF:'Franc suisse', CAD:'Dollar canadien', AUD:'Dollar australien', JPY:'Yen japonais', NZD:'Dollar néo-zélandais', SGD:'Dollar de Singapour', HKD:'Dollar de Hong Kong', SEK:'Couronne suédoise', NOK:'Couronne norvégienne', DKK:'Couronne danoise', PLN:'Zloty polonais', ZAR:'Rand sud-africain', MXN:'Peso mexicain', TRY:'Livre turque', AED:'Dirham des EAU', CNH:'Yuan offshore'};
const PLATFORMS = ['MetaTrader 5', 'MetaTrader 4', 'cTrader', 'TradingView', 'NinjaTrader', 'DXtrade', 'Match-Trader', 'Autre'];
const PROP_PHASES = [{id:'challenge', name:'Challenge'}, {id:'verification', name:'Vérification'}, {id:'funded', name:'Financé'}];
const ACC_COLORS = ['#3987e5', '#22c55e', '#f5a524', '#d55181', '#9085e9', '#199e70', '#e5673a', '#8b94a7'];
const ASSETS = {
  forex: ['EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','NZDUSD','USDCAD','EURGBP','EURJPY','GBPJPY','EURCHF','EURAUD','EURCAD','EURNZD','GBPAUD','GBPCAD','GBPCHF','GBPNZD','AUDJPY','AUDCAD','AUDNZD','AUDCHF','CADJPY','CHFJPY','NZDJPY','NZDCAD'],
  matieres: ['XAUUSD','XAGUSD','XTIUSD','XBRUSD','USOIL','UKOIL','XNGUSD','XPTUSD','XPDUSD','COPPER'],
  indices: ['US500','US30','USTEC','NAS100','US2000','DE40','UK100','F40','JP225','STOXX50','HK50','AUS200'],
  crypto: ['BTCUSD','ETHUSD','SOLUSD','XRPUSD','BNBUSD','ADAUSD','DOGEUSD','LTCUSD','AVAXUSD','LINKUSD','DOTUSD'],
  actions: ['AAPL','TSLA','NVDA','MSFT','AMZN','META','GOOGL','AMD','NFLX','COIN','MSTR','PLTR','JPM','BA','DIS','INTC']
};
const FX = ['USD','EUR','GBP','JPY','CHF','AUD','NZD','CAD','SEK','NOK','DKK','SGD','HKD','MXN','ZAR','TRY','PLN','CNH','HUF','CZK'];
function guessClass(sym) {
  const s = String(sym || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (['SPY', 'QQQ', 'IWM', 'DIA', 'VTI', 'VOO', 'GLD', 'SLV', 'TLT', 'XLF', 'XLE', 'ARKK'].includes(s)) return 'etf';
  if (!s) return 'autre';
  for (const [k, list] of Object.entries(ASSETS)) if (list.includes(s)) return k;
  if (/^(XAU|XAG|XTI|XBR|XNG|XPT|XPD|WTI|BRENT|OIL|GOLD|SILVER|NATGAS)/.test(s)) return 'matieres';
  if (/^(BTC|ETH|SOL|XRP|BNB|ADA|DOGE|LTC|AVAX|LINK|DOT|MATIC|SHIB|TRX)/.test(s)) return 'crypto';
  if (/^(US|DE|UK|GER|FRA|JP|EU|HK|AUS|NAS|SPX|DJ|DAX|CAC|NDX|RUT)\d{2,4}/.test(s) || /^(USTEC|SPX|NDX|DJI|DAX|CAC)/.test(s)) return 'indices';
  if (s.length === 6 && FX.includes(s.slice(0, 3)) && FX.includes(s.slice(3))) return 'forex';
  return 'actions';
}
const DEFAULT_SETTINGS = {riskMode: 'cur', setups: ['Breakout', 'Pullback', 'Range', 'Retournement', 'News'], beR: 0};
const RISK_MODES = [
  {id:'cur', name:'Montant en devise', hint:'Tu tapes le risque en $ / € (ex. 50).'},
  {id:'r', name:'En R (part du R-MAX)', hint:'Tu tapes la part de ton R-MAX (ex. 0,5 pour 0,5 R).'},
  {id:'pct', name:'En % du solde', hint:'Tu tapes un pourcentage du solde du compte (ex. 1 pour 1 %).'}
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => dStr(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const monthName = (y, m) => new Date(y, m, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
const monthShort = (y, m) => new Date(y, m, 1).toLocaleDateString('fr-FR', {month:'short'}).replace('.', '') + ' ' + String(y).slice(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const lsGet = (k, f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const parseNum = s => { const v = parseFloat(String(s ?? '').replace(/\s/g, '').replace(',', '.').replace('−', '-')); return isFinite(v) ? v : NaN; };
const nf2 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const nf1 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const curFmts = {};
function money(n, cur, signed) {
  if (n == null || !isFinite(n)) return '—';
  const k = cur || 'USD';
  const f = curFmts[k] ||= new Intl.NumberFormat('fr-FR', {style:'currency', currency:k, currencyDisplay:'narrowSymbol'});
  const s = f.format(Math.abs(n));
  return (n < 0 ? '−' : signed && n > 0 ? '+' : '') + s;
}
function money0(n, cur) {
  const k = 'z' + (cur || 'USD');
  const f = curFmts[k] ||= new Intl.NumberFormat('fr-FR', {style:'currency', currency:cur || 'USD', currencyDisplay:'narrowSymbol', maximumFractionDigits:0});
  return (n < 0 ? '−' : '') + f.format(Math.abs(n));
}
const fR = (n, signed = true) => n == null || !isFinite(n) ? '—' : (n < 0 ? '−' : signed && n > 0 ? '+' : '') + nf2.format(Math.abs(n)) + ' R';
const fPct = (n, d = 0) => n == null || !isFinite(n) ? '—' : (d ? nf1.format(n * 100) : Math.round(n * 100)) + ' %';
const fNum = n => n == null || !isFinite(n) ? '—' : nf2.format(n);
const sgnCls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero';
const fmtDate = s => parseD(s).toLocaleDateString('fr-FR');
function guessSession(time) {
  let h, m;
  if (time) { [h, m] = time.split(':').map(Number); } else { const d = new Date(); h = d.getHours(); m = d.getMinutes(); }
  const x = h + m / 60;
  if (x >= 1 && x < 9) return 'asia';
  if (x >= 9 && x < 14.5) return 'london';
  if (x >= 14.5 && x < 22) return 'ny';
  return 'off';
}

/* ---------- state ---------- */
const now = new Date();
const state = {
  mode: lsGet('ttr-mode', null) || (window.innerWidth < 760 ? 'phone' : 'desk'),
  view: lsGet('ttr-view', 'dash'),
  period: lsGet('ttr-period', 'all'),
  unit: lsGet('ttr-unit', 'cur'),
  tmpSel: 'all', movConv: lsGet('ttr-movconv', ''), movAcc: 'all', movFilter: 'all',
  cy: now.getFullYear(), cm: now.getMonth(),
  calY: now.getFullYear(), calM: now.getMonth(),
  db: {accounts: [], trades: [], movements: []}, settings: {},
  demo: false, loaded: false, store: 'pending',
  me: null, myEmail: '', user: null, isAdmin: false, menuOpen: false, accMenuOpen: false,
  sideMini: lsGet('ttr-side-mini', false),
  admin: {users: [], accounts: [], trades: [], movements: [], settings: {}}, adminLoaded: false, viewAs: null,
  q: '', fSide: 'all', fRes: 'all'
};
const readOnly = () => !!state.viewAs || state.demo;
const settings = () => ({...DEFAULT_SETTINGS, ...(state.settings || {})});
function data() {
  if (state.demo) return DEMO;
  if (state.viewAs) {
    const id = state.viewAs.id, A = state.admin;
    return {accounts: A.accounts.filter(x => x.user_id === id), trades: A.trades.filter(x => x.user_id === id), movements: A.movements.filter(x => x.user_id === id), settings: {...DEFAULT_SETTINGS, ...(A.settings[id] || {})}};
  }
  return {...state.db, settings: settings()};
}

/* ---------- row mapping ---------- */
const ts = v => Date.parse(v) || 0;
const numOrNull = v => v == null || v === '' ? null : Number(v);
const rowToAcc = r => ({id: r.id, user_id: r.user_id, name: r.name || '', broker: r.broker || '', kind: r.kind || 'reel', currency: r.currency || 'USD', capital: Number(r.capital) || 0, rmax: Number(r.rmax) || 0, archived: !!r.archived,
  platform: r.platform || '', number: r.number || '', opened_on: r.opened_on ? String(r.opened_on).slice(0, 10) : '', color: r.color || '',

async function onAuthSubmit(e) {
  e.preventDefault();
  const m = authMode;
  const msg = $('#a-msg'), btn = $('#a-submit');
  const fail = t => { msg.className = 'auth-msg err'; msg.textContent = t; btn.disabled = false; };
  const email = ($('#a-email') || {}).value ? $('#a-email').value.trim() : '';
  const pass = ($('#a-pass') || {}).value || '';
  const pass2 = ($('#a-pass2') || {}).value || '';
  if (email) authEmail = email;
  if (m !== 'recovery' && !/^\S+@\S+\.\S+$/.test(email)) return fail('Indique une adresse e-mail valide.');
  if ((m === 'login' || m === 'signup' || m === 'recovery') && pass.length < 6) return fail('Le mot de passe doit faire au moins 6 caractères.');
  if ((m === 'signup' || m === 'recovery') && pass !== pass2) return fail('Les deux mots de passe ne sont pas identiques.');
  btn.disabled = true; msg.className = 'auth-msg'; msg.textContent = {login: 'Connexion…', signup: 'Création du compte…', forgot: 'Envoi…', recovery: 'Enregistrement…'}[m];
  const rememberBox = $('#a-remember');
  try {
    if (m === 'login' || m === 'signup') {
      lsSet('ttr-remember', rememberBox ? rememberBox.checked : true);
      try { sessionStorage.setItem('ttr-alive', '1'); } catch (x) {}
    }
    if (m === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) throw error;
    } else if (m === 'signup') {
      const {data: d, error} = await sb.auth.signUp({email, password: pass, options: {emailRedirectTo: appUrl()}});
      if (error) throw error;
      if (!d.session) { authMode = 'login'; return showAuth('Compte créé. Ouvre le lien reçu par e-mail pour le confirmer (regarde aussi dans les indésirables), puis connecte-toi.', 'ok'); }
    } else if (m === 'forgot') {
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: appUrl()});
      if (error) throw error;
      authMode = 'login';
      return showAuth('Si un compte existe avec cette adresse, un e-mail vient de partir. Ouvre le lien qu’il contient pour choisir un nouveau mot de passe (regarde aussi dans les indésirables).', 'ok');
    } else if (m === 'recovery') {
      const {error} = await sb.auth.updateUser({password: pass});
      if (error) throw error;
      state.recovering = false;
      try { history.replaceState(null, '', appUrl()); } catch (x) {}
      authMode = 'login';
      hideAuth();
      if (state.store !== 'cloud') { state.store = 'cloud'; fetchAll(); checkAdmin(); startRealtime(); }
      toast('Mot de passe modifié');
    }
  } catch (err) {
    fail(authError(err));
  }
}

function monthList(list) {
  const out = [];
  if (state.period === 'month') { for (let k = 11; k >= 0; k--) { const d = new Date(state.cy, state.cm - k, 1); out.push([d.getFullYear(), d.getMonth()]); } }
  else if (state.period === 'year') { for (let m = 0; m < 12; m++) out.push([state.cy, m]); }
  else {
    if (!list.length) return out;
    const first = list[0].date, last = list[list.length - 1].date > todayStr() ? list[list.length - 1].date : todayStr();
    let d = new Date(+first.slice(0, 4), +first.slice(5, 7) - 1, 1);
    const end = new Date(+last.slice(0, 4), +last.slice(5, 7) - 1, 1);
    while (d <= end) { out.push([d.getFullYear(), d.getMonth()]); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
    while (out.length > 36) out.shift();
  }
  return out;
}

/* ---------- breakdown table (label · trades · win rate · diverging bar · result) ---------- */
function breakdown(groups, c, sortBy = 'total') {
  const rows = groups.filter(g => g.list.length).map(g => {
    const s = stats(g.list, c);
    return {...g, n: s.n, wr: s.winrate, total: s.total};
  });
  if (!rows.length) return `<div class="empty-card">Pas encore de données.</div>`;
  if (sortBy === 'total') rows.sort((a, b) => b.total - a.total);
  const max = Math.max(...rows.map(r => Math.abs(r.total)), 1e-9);
  return `<div class="brk">
    <div class="brk-row head"><span>&nbsp;</span><span class="r">Trades</span><span class="r">Réussite</span><span></span><span class="r">Résultat</span></div>
    ${rows.map(r => `<div class="brk-row" title="${esc(r.label)} : ${r.n} trades, ${fPct(r.wr)} de réussite, ${esc(fV(r.total, c))}">
      <span class="lbl">${r.color ? `<i style="background:${r.color}"></i>` : ''}${esc(r.label)}</span>
      <span class="r num">${r.n}</span>
      <span class="r num">${fPct(r.wr)}</span>
      <span class="dtrack"><span class="dfill ${r.total >= 0 ? 'p' : 'n'}" style="width:calc(${Math.abs(r.total) / max * 50}% - 1px)"></span></span>
      <span class="r num ${sgnCls(r.total)}">${fV(r.total, c)}</span>
    </div>`).join('')}
  </div>`;
}
const groupBy = (list, keyFn) => { const m = new Map(); list.forEach(t => { const k = keyFn(t); if (k == null) return; if (!m.has(k)) m.set(k, []); m.get(k).push(t); }); return m; };

function calendarHtml(c) {
  const y = state.calY, m = state.calM, key = `${y}-${pad(m + 1)}`;
  const first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  const byDay = {};
  c.trades.forEach(t => { if (t.date.startsWith(key)) (byDay[t.date] ||= []).push(t); });
  const dayVal = l => l.reduce((a, t) => a + val(t, c), 0);
  const vals = Object.values(byDay).map(dayVal);
  const max = Math.max(...vals.map(Math.abs), 1e-9);
  const monthList = c.trades.filter(t => t.date.startsWith(key));
  const ms = stats(monthList, c);
  const today = todayStr();
  let cells = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim', 'Semaine'].map(d => `<div class="dow">${d}</div>`).join('');
  let day = 1 - offset;
  while (day <= dim) {
    let wk = 0, wn = 0;
    for (let i = 0; i < 7; i++, day++) {
      if (day < 1 || day > dim) { cells += `<div class="cell out"></div>`; continue; }
      const ds = `${key}-${pad(day)}`, l = byDay[ds];
      if (!l) { cells += `<div class="cell${ds === today ? ' today' : ''}"><span class="d">${day}</span></div>`; continue; }
      const v = dayVal(l); wk += v; wn += l.length;
      const pct = Math.round(14 + 46 * Math.abs(v) / max);
      cells += `<div class="cell has${ds === today ? ' today' : ''}" style="background:color-mix(in srgb,var(${v >= 0 ? '--win' : '--loss'}) ${pct}%,var(--surface-2))" title="${fmtDate(ds)} : ${l.length} trade${l.length > 1 ? 's' : ''}, ${esc(fV(v, c))}">
        <span class="d">${day}</span><span class="v">${fVshort(v, c)}</span><span class="n">${l.length} trade${l.length > 1 ? 's' : ''}</span></div>`;
    }
    cells += `<div class="cell wk"><span class="d">${wn ? wn + ' tr.' : ''}</span>${wn ? `<span class="v ${sgnCls(wk)}">${fVshort(wk, c)}</span>` : ''}</div>`;
  }
  return `<div class="card-head" style="margin-bottom:10px">
      <div><h3 style="text-transform:capitalize">${monthName(y, m)}</h3><p class="hint" style="margin:0">${ms.n ? `<span class="num ${sgnCls(ms.total)}">${fV(ms.total, c)}</span> · ${ms.n} trades · ${fPct(ms.winrate)} de réussite` : 'Aucun trade ce mois-ci'}</p></div>
      <div class="nav"><button type="button" data-cal="-1" aria-label="Mois précédent"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button><button type="button" data-cal="1" aria-label="Mois suivant"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M5 2l5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></div>
    </div>
    <div class="cal">${cells}</div>`;
}

const lastPrefs = () => lsGet('ttr-last', {});
function activeAccounts(c) { return c.d.accounts.filter(a => !a.archived); }
// accounts a new trade can go into: the open accounts currently shown (or every open account if only archived ones are shown)
function entryAccounts(c) { const s = c.accs.filter(a => !a.archived); return s.length ? s : activeAccounts(c); }
function defaultAccount(c) {
  const sel = entryAccounts(c);
  const last = lastPrefs().account_id;
  if (sel.length === 1) return sel[0].id;
  if (sel.some(a => a.id === last)) return last;
  return sel[0] ? sel[0].id : '';
}
function riskToCur(str, mode, acc, d) {
  const v = parseNum(str);
  if (!isFinite(v) || v <= 0) return {err: 'Indique le risque du trade (supérieur à 0).'};
  if (mode === 'r') { if (!acc.rmax) return {err: 'Pour saisir en R, renseigne d’abord le R-MAX du compte (page Comptes).'}; return {v: round2(v * acc.rmax)}; }
  if (mode === 'pct') { const bal = accountBalance(acc, d); if (bal <= 0) return {err: 'Solde du compte nul : impossible de calculer un %.'}; return {v: round2(v / 100 * bal)}; }
  return {v: round2(v)};
}
function curToRiskStr(risk, mode, acc, d) {
  if (!risk) return '';
  if (mode === 'r' && acc && acc.rmax) return String(Math.round(risk / acc.rmax * 1000) / 1000).replace('.', ',');
  if (mode === 'pct' && acc) { const b = accountBalance(acc, d); if (b > 0) return String(Math.round(risk / b * 10000) / 100).replace('.', ','); }
  return String(risk).replace('.', ',');
}
const riskUnit = (mode, cur) => mode === 'r' ? 'R' : mode === 'pct' ? '%' : (cur || '$');
function classFor(asset, d) {
  const prev = [...d.trades].reverse().find(t => t.asset === asset);
  return prev ? prev.asset_class : guessClass(asset);
}

function quickPreview(c) {

function bindQuick(c) {

  const map = {'q-date': 'date', 'q-acc': 'account_id', 'q-asset': 'asset', 'q-side': 'side', 'q-session': 'session', 'q-risk': 'risk', 'q-pnl': 'pnl', 'q-comm': 'comm', 'q-swap': 'swap', 'q-setup': 'setup', 'q-note': 'note'};

async function quickSave() {
  if (readOnly()) return;
  // flush the pending "change" of the field being typed in now, before the row is cleared and redrawn
  try { document.activeElement && document.activeElement.blur(); } catch (x) {}
  const c = ctx();
  const acc = c.accById[quick.account_id];
  const asset = quick.asset.trim().toUpperCase();
  const pnl = parseNum(quick.pnl);
  const rk = acc ? riskToCur(quick.risk, c.d.settings.riskMode, acc, c.d) : {err: 'Choisis un compte.'};
  quick.err = '';
  let focus = null;
  if (!quick.date) { quick.err = 'Choisis une date.'; focus = 'q-date'; }
  else if (!acc) { quick.err = 'Choisis un compte.'; focus = 'q-acc'; }
  else if (!asset) { quick.err = 'Indique l’actif (ex. EURUSD).'; focus = 'q-asset'; }
  else if (rk.err) { quick.err = rk.err; focus = 'q-risk'; }
  else if (!isFinite(pnl)) { quick.err = 'Indique le résultat brut (négatif pour une perte, 0 si break-even).'; focus = 'q-pnl'; }
  if (quick.err) { render(); document.getElementById(focus)?.focus(); return; }
  const t = {account_id: acc.id, date: quick.date, time: '', asset, asset_class: classFor(asset, c.d), side: quick.side, session: quick.session, risk: rk.v, rmax: acc.rmax, pnl: round2(pnl), commission: round2(Math.abs(parseNum(quick.comm)) || 0), swap: round2(parseNum(quick.swap) || 0), lots: null, setup: quick.setup.trim(), note: quick.note.trim()};
  lsSet('ttr-last', {...lastPrefs(), account_id: acc.id, riskStr: quick.risk, session: quick.session});
  Object.assign(quick, {asset: '', pnl: '', comm: '', swap: '', note: '', setup: ''});
  try { await saveRow('trades', t); toast(`${t.asset} ajouté : ${money(round2(t.pnl - t.commission + t.swap), acc.currency, true)}`); }
  catch (e) { toast('Enregistrement impossible : ' + errText(e)); }
  render();
  document.getElementById('q-asset')?.focus();
}

/* ---------- CSV export (backup: the free Supabase plan has no automatic backup) ---------- */
const csvNum = n => n == null || !isFinite(n) ? '' : String(Math.round(n * 10000) / 10000).replace('.', ',');
function downloadCsv(rows, name) {
  const csv = '﻿' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function exportTrades(list, c) {
  if (!list.length) return toast('Rien à exporter.');
  const rows = [['Date', 'Heure', 'Compte', 'Devise', 'Actif', 'Marché', 'Sens', 'Session', 'Risque', 'R-MAX', 'Risque (R)', 'Résultat brut', 'Commission', 'Swap', 'Net', 'R/Trade', 'R réel', 'Lots', 'Setup', 'Note']].concat(

  downloadCsv(rows, `track-record-trades-${todayStr()}.csv`);
  toast('Sauvegarde des trades téléchargée');
}
function exportMovements(c) {
  const d = c.d;

// totals: three boxes (deposited, withdrawn, net), one line per currency
function movTotals(list, c) {
  const mf = state.movFilter || 'all'; // "Dépôts" or "Retraits" alone: only the matching box
  const by = {};
  let nd = 0, nr = 0;
  list.forEach(m => { const cur = accCur(c, m.account_id); const o = by[cur] ||= {dep: 0, ret: 0}; if (m.kind === 'depot') { o.dep += m.amount; nd++; } else { o.ret += m.amount; nr++; } });
  const curs = Object.keys(by).sort((a, b) => a === 'USD' ? -1 : b === 'USD' ? 1 : a === 'EUR' ? -1 : b === 'EUR' ? 1 : a.localeCompare(b));
  const conv = '';
  const sum = key => {
    if (!conv) return null;
    let t = 0;
    for (const cur of curs) { const v = convert(by[cur][key], cur, conv); if (v == null) return null; t += v; }
    return t;
  };
  const box = (cls, icon, label, key, count, sign) => {
    const total = key === 'net' ? (conv ? (sum('dep') == null ? null : sum('dep') - sum('ret')) : null) : sum(key);
    const val = cur => key === 'net' ? by[cur].dep - by[cur].ret : by[cur][key];
    // amounts stay neutral: + for money in, − for money out (green/red are kept for trading results)
    const fmt = (v, cur) => key === 'net' ? money(v, cur, true) : (v ? (sign ? '−' : '+') : '') + money(v, cur);
    const lines = curs.map(cur => `<div class="mvt-line"><span>${cur}</span><strong class="num">${fmt(val(cur), cur)}</strong></div>`).join('');
    return `<div class="mvt-box ${cls}">
      <div class="mvt-head"><span class="mvt-ico">${icon}</span><span>${label}</span>${count != null ? `<em>${count}</em>` : ''}</div>
      ${conv && total != null
        ? `<div class="mvt-big num ${sign && total ? 'neg' : key === 'net' && total < 0 ? 'neg' : ''}">${(sign && total ? '−' : '') + money(total, conv)}</div><div class="mvt-detail">${(() => { const parts = curs.filter(cur => val(cur)).map(cur => money(key === 'net' ? val(cur) : Math.abs(val(cur)), cur)); return parts.length > 1 ? 'soit ' + parts.join(' et ') : parts.length === 1 && !(parts[0].includes(curSym(conv))) ? 'soit ' + parts[0] : '&nbsp;'; })()}</div>`
        : curs.length === 1 ? `<div class="mvt-big num">${fmt(val(curs[0]), curs[0])}</div>` : lines}
    </div>`;
  };
  return `<div class="mvt">
    <div class="mvt-boxes">
      ${mf !== 'depot' ? box('ret', '💸', 'Total retiré', 'ret', `${nr} retrait${nr > 1 ? 's' : ''}`, true) : ''}
      ${mf !== 'retrait' ? box('dep', '💰', 'Total déposé', 'dep', `${nd} dépôt${nd > 1 ? 's' : ''}`, false) : ''}
      ${mf === 'all' ? box('net', '🧮', 'Net apporté', 'net', null, false) : ''}
    </div>
  </div>`;
}

// Profile photo: cropped to a square, shrunk to 192 px and kept in the user's settings (synced to all devices).
function shrinkImage(file, size = 192) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Ce fichier n’est pas une image.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const cv = document.createElement('canvas'); cv.width = cv.height = size;
      cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible : essaie avec une photo JPG ou PNG.')); };
    img.src = url;
  });
}
async function setAvatar(file) {
  try { const data = await shrinkImage(file); await saveSettings({avatar: data}); toast('Photo de profil mise à jour'); }
  catch (e) { toast(e.message || 'Impossible de lire cette image.'); }
}
async function changeEmail() {
  const email = prof.email.trim();
  prof.msgE = null;
  if (!/^\S+@\S+\.\S+$/.test(email)) { prof.msgE = {kind: 'err', text: 'Indique une adresse e-mail valide.'}; return profRender(); }
  if (email.toLowerCase() === String(state.myEmail).toLowerCase()) { prof.msgE = {kind: 'err', text: 'C’est déjà ton adresse actuelle.'}; return profRender(); }
  prof.busyE = true; profRender();
  try {
    const {error} = await sb.auth.updateUser({email}, {emailRedirectTo: appUrl()});
    if (error) throw error;
    prof.email = '';
    prof.msgE = {kind: 'ok', text: `Un lien de confirmation vient de partir vers ${email} (regarde aussi dans les indésirables). Ton adresse changera après ton clic.`};
  } catch (e) { prof.msgE = {kind: 'err', text: authError(e)}; }
  prof.busyE = false; profRender();
}
async function changePassword() {
  prof.msgP = null;
  if (!prof.cur) { prof.msgP = {kind: 'err', text: 'Indique ton mot de passe actuel.'}; return profRender(); }
  if (prof.n1.length < 6) { prof.msgP = {kind: 'err', text: 'Le nouveau mot de passe doit faire au moins 6 caractères.'}; return profRender(); }
  if (prof.n1 !== prof.n2) { prof.msgP = {kind: 'err', text: 'Les deux nouveaux mots de passe ne sont pas identiques.'}; return profRender(); }
  if (prof.n1 === prof.cur) { prof.msgP = {kind: 'err', text: 'Choisis un mot de passe différent de l’actuel.'}; return profRender(); }
  prof.busyP = true; profRender();
  try {
    const chk = await sb.auth.signInWithPassword({email: state.myEmail, password: prof.cur});
    if (chk.error) { prof.msgP = {kind: 'err', text: /Invalid login/i.test(chk.error.message || '') ? 'Ton mot de passe actuel est incorrect.' : authError(chk.error)}; }
    else {
      const {error} = await sb.auth.updateUser({password: prof.n1});
      if (error) throw error;
      prof.cur = prof.n1 = prof.n2 = '';
      prof.msgP = {kind: 'ok', text: 'Mot de passe modifié. Utilise le nouveau à ta prochaine connexion.'};
    }
  } catch (e) { prof.msgP = {kind: 'err', text: authError(e)}; }
  prof.busyP = false; profRender();
}

    syncTradeForm();

  } else if (form.kind === 'account') {
    bind('a-name', 'name'); bind('a-broker', 'broker'); bind('a-number', 'number'); bind('a-opened', 'opened_on'); bind('a-platform', 'platform');
    bind('a-capital', 'capitalStr', syncAccountForm); bind('a-rmax', 'rmaxStr', syncAccountForm);

    bind('a-cur-more', '_cur', n => { if (n.value) { form.currency = n.value; syncAccountForm(); } });

}
function tradeValues(c) {
  const f = form, acc = c.accById[f.account_id];
  if (!acc) return {err: 'Choisis un compte.'};
  const rk = riskToCur(f.riskStr, c.d.settings.riskMode, acc, c.d);
  const rmaxIn = parseNum(f.rmaxStr);
  const rmax = isFinite(rmaxIn) && rmaxIn >= 0 && String(f.rmaxStr).trim() !== '' ? round2(rmaxIn) : acc.rmax;
  const raw = parseNum(f.pnlStr);
  const pnl = !f.resKind ? 0 : f.resKind === 'be' ? (isFinite(raw) ? round2(raw) : 0) : isFinite(raw) ? round2(Math.abs(raw) * (f.resKind === 'loss' ? -1 : 1)) : NaN;
  const commission = f.resKind ? round2(Math.abs(parseNum(f.commStr)) || 0) : 0;
  const swap = f.resKind ? round2((Math.abs(parseNum(f.swapStr)) || 0) * f.swapSign) : 0;
  return {acc, rk, pnl, rmax, commission, swap};
}
function tradeCalc(c) {
  const el = $('#t-calc'); if (!el) return;
  const v = tradeValues(c);
  if (v.err || !form.resKind || !isFinite(v.pnl)) { el.innerHTML = ''; return; }
  const net = round2(v.pnl - v.commission + v.swap);
  const parts = [`Net : <strong class="${sgnCls(net)}">${money(net, v.acc.currency, true)}</strong>`];
  if (v.rk.v) parts.push(`R/Trade : <strong class="${sgnCls(net)}">${fR(net / v.rk.v)}</strong>`);
  if (v.rmax) parts.push(`R réel : <strong class="${sgnCls(net)}">${fR(net / v.rmax)}</strong>`);
  el.innerHTML = parts.map(p => `<span>${p}</span>`).join('');
}
function closePanel() { $('#panel-root').innerHTML = ''; form = null; }
async function panelSave() {

    const t = {id: f.id, account_id: v.acc.id, date: f.date, time: f.time || '', asset, asset_class: f.asset_class, side: f.side, session: f.session, risk: v.rk.v, rmax: v.rmax,
      pnl: v.pnl, commission: v.commission, swap: v.swap, lots: f.lots ?? null, setup: f.setup || '', note: f.note || '',

    // same little show as deposits: spinner, then a tick, then the window closes

    const t0 = Date.now();

      const net = round2(t.pnl - t.commission + t.swap);
      if (txt) txt.textContent = t.open ? 'Trade ouvert ⏳' : f.wasOpen ? 'Trade clôturé' : f.id ? 'Enregistré' : `${asset} : ${money(net, v.acc.currency, true)}`;

    const pct = (v, label) => { if (String(v ?? '').trim() === '') return {v: null}; const x = parseNum(v); return isFinite(x) && x > 0 && x <= 100 ? {v: round2(x)} : {err: `${label} : indique un pourcentage entre 0 et 100.`}; };

    if (!isFinite(rmax) || rmax <= 0) { $('#a-rmax')?.focus(); return fail('Indique ton R-MAX : le risque maximum par trade, en montant.'); }

      prop_phase: f.prop_phase, prop_target: tg.v ?? null, prop_daily_loss: dl.v ?? null, prop_max_dd: md.v ?? null};
    const btn = document.querySelector('#panel-root [data-save]'); if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }

    const btn = document.querySelector('#panel-root .mv-save'), txt = $('#mv-save-txt');

      if (btn) { btn.classList.remove('loading'); btn.classList.add('done'); }
      if (txt) txt.textContent = f.id ? 'Enregistré' : m.kind === 'depot' ? 'Dépôt ajouté' : 'Retrait ajouté';
      await new Promise(r => setTimeout(r, 750));

      fail('Enregistrement impossible : ' + errText(e));

}
