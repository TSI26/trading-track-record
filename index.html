<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Track-Record">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Trading Track-Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Same skeleton as Tracking by Wealth: two modes (desk = sidebar + grid + spreadsheet; phone = narrow column + bottom bar + sheet).
   Look: trading terminal. Near-black surfaces, amber accent, green/red for P&L, monospace figures. */
:root{
  --bg:#0b0e14; --surface:#11151d; --surface-2:#181d27; --line:#232a37; --line-2:#2e3746;
  --fg:#e7eaf0; --muted:#8b94a7; --accent:#f5a524; --accent-ink:#1a1204;
  --win:#22c55e; --win-soft:rgba(34,197,94,.13); --win-ink:#04210f;
  --loss:#f2545b; --loss-soft:rgba(242,84,91,.13);
  --be:#8b94a7;
  --dep:#4b94ec; --ret:#e8b04a; --ret-ink:#2a1d04;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --font-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f0f2f6; --line:#e0e4eb; --line-2:#cfd5df;
    --fg:#10141c; --muted:#5b6578; --accent:#c77a00; --accent-ink:#ffffff;
    --win:#11905a; --win-soft:rgba(17,144,90,.10); --win-ink:#ffffff;
    --loss:#d93a42; --loss-soft:rgba(217,58,66,.09);
    --be:#5b6578;
    --dep:#2a78d6; --ret:#b7791f; --ret-ink:#ffffff;
    --dep:#2a78d6; --ret:#b7791f; --ret-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6;
    --shadow:0 8px 24px rgba(20,30,60,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f0f2f6; --line:#e0e4eb; --line-2:#cfd5df;
  --fg:#10141c; --muted:#5b6578; --accent:#c77a00; --accent-ink:#ffffff;
  --win:#11905a; --win-soft:rgba(17,144,90,.10); --win-ink:#ffffff;
  --loss:#d93a42; --loss-soft:rgba(217,58,66,.09);
  --be:#5b6578;
  --dep:#2a78d6; --ret:#b7791f; --ret-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#6250d6;
  --shadow:0 8px 24px rgba(20,30,60,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1,'lnum' 1,'zero' 0}
.kpi .k-val,.acc-bal,.side-bal strong,.big-amt .field,.field.n,.qf.n,.slist li strong,.cal .cell .v,.calc strong,.acc-grid strong,.show-stats div strong{font-variant-numeric:tabular-nums lining-nums}
.pos{color:var(--win)} .neg{color:var(--loss)} .zero{color:var(--muted)}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap;text-transform:uppercase}
.brand .logo{width:28px;height:28px;flex:none}
.brand b{color:var(--accent);font-weight:700}
.brand .sub{display:block;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:-2px}

/* mode switch */
.mode-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.mode-switch button{border:0;background:transparent;border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:12.5px}
.mode-switch button svg{width:16px;height:16px;flex:none}
.mode-switch button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* ===== shared pieces ===== */
.banner{margin-bottom:16px;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13.5px}
.banner.warn{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--fg)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.seg button:disabled{opacity:.4;cursor:default}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav .label{font-family:var(--font-display);font-weight:600;font-size:15px;min-width:130px;text-align:center;text-transform:capitalize}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13.5px;max-width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px}
.ghost:hover{border-color:var(--line-2)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:10px}
.primary:disabled{opacity:.6;cursor:default}

.kpis{display:grid;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.kpi .k-val{font-family:var(--font-num);font-weight:700;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.kpi .k-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hero{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface) 65%);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}

.grid{display:grid;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-width:0}
.card h3{margin:0 0 2px;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.card .hint{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0}
.chart-box{position:relative;height:250px}
.empty-card{text-align:center;padding:26px 16px;color:var(--muted);font-size:13.5px}

/* stats list */
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.slist li:last-child{border-bottom:0}
.slist li span:first-child{color:var(--muted)}
.slist li strong{font-family:var(--font-num);font-weight:600}

/* diverging breakdown rows */
.brk{display:flex;flex-direction:column}
.brk-row{display:grid;grid-template-columns:minmax(76px,1.3fr) 42px 50px minmax(20px,1.2fr) minmax(84px,auto);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.brk-row:last-child{border-bottom:0}
.brk-row.head{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-top:0}
.brk-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:8px}
.brk-row .lbl i{width:8px;height:8px;border-radius:2px;flex:none}
.brk-row .r{text-align:right}
.dtrack{position:relative;height:12px}
.dtrack::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.dfill{position:absolute;top:0;bottom:0;border-radius:3px}
.dfill.p{left:calc(50% + 1px);background:var(--win)}
.dfill.n{right:calc(50% + 1px);background:var(--loss)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.05fr);gap:4px}
.cal .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.cal .cell{min-height:62px;border-radius:8px;background:var(--surface-2);border:1px solid transparent;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.cal .cell.out{background:transparent}
.cal .cell.today{border-color:var(--accent)}
.cal .cell .d{font-size:11px;color:var(--muted);font-weight:600}
.cal .cell .v{font-family:var(--font-num);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .cell .n{font-size:10.5px;color:var(--muted)}
.cal .cell.wk{background:transparent;border:1px dashed var(--line)}
.cal .cell.has{cursor:default}

.h-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.search{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 11px}
.search input{border:0;background:transparent;padding:8px 0;width:100%;outline:none}
.h-summary{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.welcome{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 26px;display:grid;gap:14px;justify-items:start}
.welcome h2{margin:0;font-family:var(--font-display);font-size:27px;line-height:1.12;text-wrap:balance;max-width:24ch}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.welcome .row{display:flex;flex-wrap:wrap;gap:10px}
.flag{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.flag button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.pill.long{background:var(--win-soft);color:var(--win)}
.pill.short{background:var(--loss-soft);color:var(--loss)}
.pill.kind{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ===== DESKTOP MODE ===== */
.app{min-height:100vh}
.m-desk{--sidew:248px}
.m-desk.side-mini{--sidew:68px}
.m-desk .app{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1)}
.side{display:none}
.m-desk .side{display:flex;position:sticky;top:0;height:100vh;padding:20px 12px 14px;border-right:1px solid var(--line);background:var(--surface);flex-direction:column;gap:18px;z-index:20;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
/* while the rail shrinks, the texts fade out and get clipped; icons never move */
.side .lbl{white-space:nowrap;transition:opacity .18s ease .1s}
.m-desk.side-mini .side .lbl{opacity:0;transition-delay:0s}
.side .brand{padding-left:6px;font-size:15px;gap:10px;letter-spacing:0;white-space:nowrap;min-height:30px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav button{border:0;background:transparent;padding:9px 13px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:12px;text-align:left;white-space:nowrap}
.side-nav button svg{width:18px;height:18px;flex:none}
.side-nav button:hover{background:var(--surface-2);color:var(--fg)}
.side-nav button[aria-current="page"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.side-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 14px;border-radius:9px;display:flex;align-items:center;justify-content:flex-start;gap:11px;white-space:nowrap;overflow:hidden}
.side-add svg{flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-bal{padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;white-space:nowrap;transition:opacity .18s ease .1s}
.m-desk.side-mini .side-bal{opacity:0;pointer-events:none;transition-delay:0s}
.side-bal span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.side-bal strong{font-family:var(--font-num);font-size:18px}
.side-bal small{font-size:12px;color:var(--muted)}
.side .mode-switch button{flex:1;justify-content:center;padding:6px 4px;font-size:12px;gap:4px}
.m-desk.side-mini .side .mode-switch{flex-direction:column}
.m-desk.side-mini .side .mode-switch .lbl{display:none}
/* open / close button, sitting on the sidebar's edge line */
.side-toggle{display:none;position:fixed;top:22px;left:calc(var(--sidew) - 12px);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);place-items:center;z-index:30;padding:0;opacity:.6;transition:left .32s cubic-bezier(.4,0,.2,1),opacity .2s,color .15s,border-color .15s}
.m-desk .side-toggle{display:grid}
.m-desk .side:hover + .side-toggle{opacity:.85}
.side-toggle:hover,.side-toggle:focus-visible{opacity:1 !important;color:var(--fg);border-color:var(--line-2)}
.side-toggle svg{width:12px;height:12px;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.m-desk.side-mini .side-toggle svg{transform:rotate(180deg)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group + .nav-group{margin-top:14px}
.nav-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:0 13px 6px;opacity:.75}
.m-desk.side-mini .nav-title.lbl{opacity:0}
.me-btn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 5px;text-align:left;white-space:nowrap;overflow:hidden;transition:background .2s,border-color .2s}
.me-btn:hover{border-color:var(--line-2)}
.me-btn .me-chev{width:16px;height:16px;color:var(--muted);flex:none;margin-right:4px}
.m-desk.side-mini .me-btn{border-color:transparent;background:transparent}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--loss)));color:var(--accent-ink);flex:none;text-transform:uppercase;line-height:1;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:17px;height:17px}
.avatar.lg{width:72px;height:72px;font-size:28px}
.me-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.me-txt b{font-size:13.5px}
.me-txt small{font-size:11.5px;color:var(--muted)}
.me-menu{position:fixed;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60;width:220px}
.me-menu button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-weight:600;color:var(--fg);text-align:left}
.me-menu button:hover,.me-menu button:focus-visible{background:var(--surface-2)}
.me-menu button svg{width:17px;height:17px;color:var(--muted);flex:none}
.me-menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.me-menu .danger,.me-menu .danger svg{color:var(--loss)}
@media (prefers-reduced-motion:no-preference){ .me-menu.enter{animation:pop .14s ease-out} @keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}} }
.ptop .me-btn{width:auto;padding:0;border:0;background:transparent}
.tip{position:fixed;z-index:70;background:var(--fg);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);transform:translateY(-50%)}
/* editable photo */
.avatar-edit{position:relative;border:0;background:none;padding:0;border-radius:50%;flex:none;cursor:pointer}
.avatar-edit .pen{position:absolute;inset:0;border-radius:50%;background:rgba(5,8,14,.5);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .15s}
.avatar-edit .pen svg{width:20px;height:20px}
.avatar-edit:hover .pen,.avatar-edit:focus-visible .pen{opacity:1}
.me-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 5px;white-space:nowrap;overflow:hidden;transition:background .2s,border-color .2s}
.me-card:hover{border-color:var(--line-2)}
.me-card .me-btn{border:0;background:transparent;padding:4px 2px;flex:1;min-width:0;border-radius:6px}
.me-card .avatar-edit .pen svg{width:14px;height:14px}
.m-desk.side-mini .me-card{border-color:transparent;background:transparent}
.m-desk.side-mini .me-card .avatar-edit .pen{display:none}
.link-del{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.link-del:hover{color:var(--loss)}

/* ===== top bar (computer) ===== */
.topbar{display:none}
.m-desk .topbar{display:flex;position:sticky;top:0;z-index:15;height:64px;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.tb-title{font-family:var(--font-display);font-weight:700;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-right{display:flex;align-items:center;gap:10px;flex:none}
.tb-left{display:flex;align-items:center;gap:18px;min-width:0}
.tb-tabs:empty{display:none}
.tb-tabs .dtabs{margin:0;padding:3px;border-radius:12px;gap:3px}
.tb-tabs .dtabs button{padding:7px 13px;font-size:13px;border-radius:9px}
@media (max-width:1180px){.tb-tabs .dtabs button span{display:none}}
.tb-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 15px;border-radius:9px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tb-add:hover{filter:brightness(1.06)}
.topbar .acc-sw{width:250px;padding:5px 9px 5px 5px;background:var(--surface)}
.m-desk .page-head h1{display:none}
.m-desk .page-head{justify-content:flex-end}
.m-desk .page-head:not(:has(> :nth-child(2))){display:none}
@media (max-width:860px){.m-desk .topbar{padding:0 16px}.topbar .acc-sw-txt small{display:none}}

/* ===== account switcher ===== */
.acc-sw{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 7px;text-align:left;white-space:nowrap;overflow:hidden;transition:border-color .15s,background .2s}
.acc-sw:hover,.acc-sw[aria-expanded="true"]{border-color:var(--line-2)}
.acc-sw-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.acc-sw-txt b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.acc-sw-txt small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.acc-chev{width:16px;height:16px;color:var(--muted);flex:none}
.acc-sw-bal{flex:none;font-weight:700;font-size:13px;padding-left:8px;border-left:1px solid var(--line);color:var(--fg)}
.topbar .acc-sw{width:248px;gap:8px;padding:4px 7px 4px 4px}
.topbar .acc-badge{width:28px;height:28px;font-size:13px}
.topbar .acc-sw-txt b{font-size:13px}
.topbar .acc-sw-txt small{font-size:11px}
.sub-bal{display:none}
.ptop .acc-sw-bal{display:none}
.ptop .acc-sw-txt small:has(.sub-bal) .sub-full{display:none}
.ptop .sub-bal{display:inline}
.acc-badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-family:var(--font-display);font-weight:700;font-size:14px;color:#fff;background:var(--c,var(--muted));text-transform:uppercase;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.acc-badge.sm{width:28px;height:28px;font-size:13px}
.acc-badge.empty{background:var(--surface);border:1px dashed var(--line-2);color:var(--muted);text-shadow:none}
.acc-badge.all{background:var(--surface);border:1px solid var(--line-2);color:var(--fg);text-shadow:none}
.acc-badge.all svg{width:15px;height:15px}
.ptop .acc-wrap{min-width:0;flex:1}
.ptop .acc-sw{width:auto;max-width:100%;background:transparent;border-color:transparent;padding:4px 6px 4px 2px}
.acc-menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:300px;max-height:min(70vh,560px);overflow:auto}
@media (prefers-reduced-motion:no-preference){.acc-menu.enter{animation:pop .14s ease-out}}
.acc-menu-head{display:flex;flex-direction:column;padding:6px 8px 8px}
.acc-menu-head span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.acc-menu-head small{font-size:11.5px;color:var(--muted);opacity:.8}
.acc-row{display:flex;align-items:center;gap:10px;border-radius:9px;padding:7px 8px;cursor:pointer;user-select:none}
.acc-row:hover{background:var(--surface-2)}
.acc-row.arch{opacity:.6}
.acc-row-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.acc-row-txt b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row-txt small{font-size:11.5px;color:var(--muted)}
.acc-chk{display:grid;place-items:center;width:34px;height:34px;margin:-6px -4px -6px 0;border-radius:8px;flex:none;cursor:pointer}
.acc-chk:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.acc-chk input{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer}
.acc-div{border-top:1px solid var(--line);margin:4px 6px}
.acc-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:10px 8px 4px}
.acc-menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.acc-foot{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-weight:600;color:var(--fg);text-align:left}
.acc-foot:hover{background:var(--surface-2)}
.acc-foot svg{width:17px;height:17px;color:var(--muted)}

/* ===== account window ===== */
.panel.wide{max-width:640px}
.panel-sub{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.req{color:var(--accent);font-weight:700}
.fsec{border-top:1px solid var(--line);padding-top:4px;margin-top:12px}
.fsec:first-of-type{border-top:0;margin-top:2px;padding-top:0}
.fsec[hidden]{display:none}
.fsec-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin:12px 0 0}
.fsec-title em{font-style:normal;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.fl em{font-style:normal;font-weight:500;opacity:.85}
.fhint{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.segbar{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.segbar button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 10px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.segbar button:hover{color:var(--fg)}
.segbar button[aria-checked="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2),inset 0 -2px 0 var(--accent)}
.segbar button b{font-weight:700;margin-right:2px}
.cur-line{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.cur-seg{flex:0 1 auto}
.cur-seg button[data-acurmore]{flex:0 0 auto;padding:8px 12px;font-size:16px;line-height:1;letter-spacing:1px}
.cur-line select{flex:1 1 200px;width:auto}
.inp-unit{position:relative}
.inp-unit .field{padding-right:34px}
.inp-unit .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;font-size:13px;pointer-events:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0;box-shadow:inset 0 0 0 2px var(--surface);transition:transform .12s}
.swatch:hover{transform:scale(1.08)}
.swatch[aria-checked="true"]{border-color:var(--fg)}
.cancel{border:1px solid var(--line);background:transparent;border-radius:12px;padding:13px 18px;font-weight:700}
.save:disabled{opacity:.6;cursor:default}
.m-phone .row3{grid-template-columns:1fr 1fr}
.m-phone .segbar button{padding:8px 6px;font-size:13px}
/* account page */
.prof-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prof-head h2{margin:0;font-family:var(--font-display);font-size:21px}
.prof-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.prof-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));margin-top:10px}
.prof-form{display:flex;flex-direction:column;gap:10px;max-width:440px}
.prof-form .a-field .field{font-size:15px;padding:10px 12px;background:var(--bg)}
.prof-msg{font-size:13.5px;line-height:1.4}
.prof-msg.err{color:var(--loss)} .prof-msg.ok{color:var(--win)}
.prof-msg:empty{display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.m-desk .wrap{width:100%;max-width:1520px;margin:0 auto;padding-inline:28px;padding-block:24px 60px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-bottom:16px}
.page-head h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1}
.page-head h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}

.m-desk .kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.m-desk .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
.m-desk .s3{grid-column:span 3}.m-desk .s4{grid-column:span 4}.m-desk .s5{grid-column:span 5}.m-desk .s6{grid-column:span 6}
.m-desk .s7{grid-column:span 7}.m-desk .s8{grid-column:span 8}.m-desk .s12{grid-column:span 12}
.m-desk .tall .chart-box{height:300px}
@media (max-width:1250px){
  .m-desk .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .m-desk .s3,.m-desk .s4{grid-column:span 6}
  .m-desk .s5,.m-desk .s7,.m-desk .s8{grid-column:span 12}
}
@media (max-width:860px){
  .m-desk .wrap{padding-inline:16px}
  .m-desk .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m-desk .s3,.m-desk .s4,.m-desk .s6{grid-column:span 12}
}

/* spreadsheet table */
.sheet-table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;margin-top:12px;max-height:calc(100vh - 230px)}
/* ===== Mes trades: the period bar ===== */
.pbar{display:flex;align-items:stretch;gap:14px;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.py{display:flex;align-items:center;gap:4px;padding:0 4px 0 2px;border-right:1px solid var(--line);padding-right:12px}
.py button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center;transition:color .15s,border-color .15s,background .15s}
.py button:hover:not(:disabled){color:var(--fg);border-color:var(--line-2)}
.py button:disabled{opacity:.35;cursor:default}
.py-y{font-family:var(--font-display);font-weight:700;font-size:19px;min-width:54px;text-align:center}
.pms{flex:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.pm{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 2px 8px;border-radius:11px;border:1px solid var(--line);background:var(--bg);cursor:pointer;user-select:none;transition:background .18s,border-color .18s,transform .12s,box-shadow .18s}
.pm b{font-size:13px;font-weight:700}
.pm small{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.pm small.pos{color:var(--win)} .pm small.neg{color:var(--loss)}
.pm:hover{border-color:var(--line-2);background:var(--surface-2)}
.pm:active{transform:scale(.97)}
.pm.empty b{color:var(--muted);font-weight:600}
.pm.now::after{content:"";position:absolute;top:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.pm.on{background:color-mix(in srgb,var(--accent) 16%,var(--bg));border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 6px 16px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
.pm.on b{color:var(--fg)}
.pms.all .pm.on{box-shadow:none;border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--bg))}
.pm-chk{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:transparent;opacity:0;transition:opacity .15s,background .15s,border-color .15s,color .15s,transform .12s}
.pm-chk svg{width:11px;height:11px}
.pm:hover .pm-chk,.pm.on .pm-chk,.pm:focus-visible .pm-chk{opacity:1}
.pm-chk:hover{border-color:var(--accent);transform:scale(1.12)}
.pm.on .pm-chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pq{display:flex;flex-direction:column;gap:6px;justify-content:center;border-left:1px solid var(--line);padding-left:12px}
.pq button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:all .15s}
.pq button:hover{color:var(--fg);border-color:var(--line-2)}
.pq button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.jt-head2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.jt-head2 .h-tools{margin-top:0;flex:1 1 460px;justify-content:flex-end}
.jt-head2 .search{flex:0 1 280px}
.m-phone .pbar{flex-wrap:wrap;gap:10px}
.m-phone .py{border-right:0;padding-right:0}
.m-phone .pms{flex-basis:100%;grid-template-columns:repeat(4,minmax(0,1fr));order:3}
.m-phone .pm{padding:17px 2px 8px}
.m-phone .pm-chk{top:4px;right:4px;width:15px;height:15px}
.m-phone .pm.now::after{top:8px;left:12px;margin-left:0}
.m-phone .pq{flex-direction:row;border-left:0;padding-left:0;margin-left:auto}
.m-phone .pm-chk{opacity:1}
/* ===== Mes trades: the table ===== */
.js-row{display:flex;gap:10px;flex-wrap:wrap;margin:0}
.m-desk .page-head.jt-head{justify-content:space-between;align-items:center}
.jt-head .filters{margin-left:auto}
#h-q{text-transform:uppercase;letter-spacing:.02em}
#h-q::placeholder{text-transform:none;letter-spacing:0}
.js-chip{display:flex;flex-direction:column;gap:3px;padding:10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:112px}
.js-chip small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.js-chip b{font-size:17px;font-weight:700}
.js-chip.open{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.js-chip.open b{color:var(--accent)}
.jt-card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 12px 30px -18px rgba(0,0,0,.45)}
table.jt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.jt thead th{position:sticky;top:0;z-index:2;text-align:left;font-family:var(--font-display);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 7px 12px;background:linear-gradient(var(--surface-2),color-mix(in srgb,var(--surface-2) 55%,var(--surface)));border-bottom:1px solid var(--line);white-space:nowrap}
.jt thead th:first-child{padding-left:17px}
.jt th.r,.jt td.r{text-align:right}
.jt td{padding:12px 7px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);vertical-align:middle;white-space:nowrap}
.jt td:first-child{padding-left:17px;position:relative}
.jt tbody tr:last-child td{border-bottom:0}
.jt tbody tr.row{cursor:pointer;transition:background .15s}
.jt-has{display:inline-flex;align-items:center;gap:2px;margin-left:2px;color:var(--muted);font-size:11px;font-weight:600}
.jt-has svg{width:14px;height:14px}
.jt tr.row:hover .jt-has{color:var(--accent)}
.jt tbody tr.row td{transition:background .15s}
.jt tbody tr.row:hover td{background:color-mix(in srgb,var(--surface-2) 80%,transparent)}
.jt tbody tr.row td:first-child::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:transparent;transition:background .15s}
.jt tbody tr.row:hover td:first-child::before{background:var(--line-2)}
.jt tr.is-open td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.jt tr.is-open:hover td{background:color-mix(in srgb,var(--accent) 12%,transparent) !important}
.jt tr.is-open td:first-child::before{background:var(--accent) !important}
.jt-sep td{padding:0;height:6px;border-bottom:1px solid var(--line);background:var(--bg)}
.jt-month td{padding:14px 12px 6px !important;background:var(--bg);border-bottom:0}
.jt-month:first-child td{padding-top:10px !important}
.jm{--mc:var(--muted);display:flex;align-items:center;gap:12px;padding:7px 16px 7px 8px;border-radius:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--mc) 12%,var(--surface)) 0%,var(--surface) 65%);border:1px solid color-mix(in srgb,var(--mc) 32%,var(--line))}
.jm.m-pos{--mc:var(--win)} .jm.m-neg{--mc:var(--loss)}
.jm{position:sticky;left:12px;max-width:calc(var(--cw,100%) - 26px);box-sizing:border-box}
.jm-cal{width:40px;height:36px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);text-align:center;flex:none}
.jm-cal small{display:block;background:var(--mc);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:1px 0}
.jm.m-pos .jm-cal small{color:var(--win-ink)}
.jm-cal b{flex:1;display:grid;place-items:center;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.02em}
.jm-txt{display:flex;align-items:baseline;gap:12px}
.jm-name{font-family:var(--font-display);font-weight:700;font-size:15px;text-transform:capitalize;letter-spacing:-.01em}
.jm-name em{font-style:normal;color:var(--muted);font-weight:500}
.jm-sub{font-size:12px;color:var(--muted)}
.jm-open{color:var(--accent);font-weight:600}
.jm{cursor:pointer;user-select:none;transition:border-color .2s,filter .2s}
.jm:hover{border-color:color-mix(in srgb,var(--mc) 55%,var(--line));filter:brightness(1.06)}
.jm:focus-visible{outline:2px solid var(--mc);outline-offset:2px}
.jm-chev{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--muted);transition:transform .25s cubic-bezier(.2,.8,.3,1),color .15s,background .15s;margin-right:-4px}
.jm-chev svg{width:15px;height:15px}
.jm:hover .jm-chev{color:var(--fg);background:var(--surface-2)}
.jm.closed .jm-chev{transform:rotate(-90deg)}
.jt tr.row.jt-hide{display:none}
@media (prefers-reduced-motion:no-preference){.jt tr.row.jt-in td{animation:jtIn .28s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d,0ms)}}
@keyframes jtIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.jt tr.row.jt-out td{animation:jtOut .2s cubic-bezier(.4,0,.8,.4) both;animation-delay:var(--d,0ms);pointer-events:none}
@keyframes jtOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-4px)}}
.jm-res{margin-left:auto;display:flex;align-items:baseline;gap:10px}
.jm-res b{font-size:15px;font-weight:700}
.jm-res span{font-size:12px;font-weight:600}
.jt-month + tr.row td{border-top:0}
.jt-hold{font-size:12.5px;color:var(--fg)}
.jt-hold span:first-child{margin-right:5px}
/* ===== Dashboard: its sub-pages ===== */
.dtabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto}
.dtabs button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;white-space:nowrap;transition:background .18s,color .18s}
.dtabs button:hover{color:var(--fg);background:var(--surface-2)}
.dtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.m-desk .page-head.with-tabs{justify-content:space-between}
.page-head.with-tabs .dtabs{margin-bottom:0}
.m-phone .dtabs{width:100%}
.m-phone .dtabs button{flex:1;justify-content:center;padding:9px 8px;font-size:13px}
.dsoon{display:flex;flex-direction:column;align-items:center;gap:8px;padding:70px 20px;border-radius:18px;border:1.5px dashed var(--line-2);color:var(--muted);text-align:center}
.dsoon span{font-size:34px}
.dsoon b{color:var(--fg);font-size:16px}
/* ===== Dashboard mensuel ===== */
.dm{display:flex;flex-direction:column;gap:14px;animation:fiIn .35s cubic-bezier(.2,.8,.3,1)}
.dm.snapping{padding:22px;background:var(--bg);border-radius:0}
.dm-hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 24px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:radial-gradient(120% 160% at 0% 0%,color-mix(in srgb,var(--accent) 18%,var(--surface)) 0%,var(--surface) 55%),var(--surface);overflow:hidden}
.dm-hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);pointer-events:none}
.dm-when{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.dm-arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--fg);display:grid;place-items:center;transition:border-color .15s,transform .12s,background .15s}
.dm-arrow:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.dm-arrow:active{transform:scale(.94)}
.dm-title h1{white-space:nowrap;margin:0;font-family:var(--font-display);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.dm-title h1 span{color:var(--accent)}
.dm-title p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.dm-pick{display:flex;flex-direction:column;align-items:flex-end;gap:8px;position:relative;z-index:1;margin-left:auto}
.dm-year{display:flex;align-items:center;gap:6px}
.dm-year b{font-family:var(--font-display);font-size:15px;min-width:42px;text-align:center}
.dm-year button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:15px;line-height:1;transition:color .15s,border-color .15s}
.dm-year button:hover{color:var(--fg);border-color:var(--line-2)}
.dm-months{display:grid;grid-template-columns:repeat(12,auto);gap:4px}
.dm-months button{position:relative;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;transition:all .15s}
.dm-months button.has{color:var(--fg)}
.dm-months button.now::after{content:"";position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.dm-months button:hover{border-color:var(--line-2)}
.dm-months button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dm-cam{position:relative;z-index:1;width:50px;height:50px;flex:none;border-radius:15px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);font-size:23px;display:grid;place-items:center;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.dm-cam:hover{transform:translateY(-2px) rotate(-6deg);border-color:var(--accent);box-shadow:0 10px 22px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.dm-cam.busy span{animation:camPulse .7s ease-in-out infinite}
@keyframes camPulse{50%{transform:scale(.8);opacity:.5}}
.dm-kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr) repeat(2,minmax(0,1.3fr));gap:12px}
.dm-k{display:flex;flex-direction:column;gap:6px;padding:15px 17px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.dm-k-top{display:flex;align-items:center;gap:8px}
.dm-k-ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-size:15px}
.dm-k small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dm-k b{font-size:26px;font-weight:700;line-height:1.1}
.dm-k-sub{font-size:12px;color:var(--muted)}
.dm-k small{white-space:nowrap}
.dm-wr{flex-direction:row;align-items:center;gap:16px;padding:10px 16px}
.dm-g{flex-direction:row;align-items:stretch;gap:8px}
.dm-g-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.dm-g-viz{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:112px;flex:none}
.dm-g-viz canvas{width:112px;height:62px;display:block}
.dm-g small,.dm-g b{white-space:nowrap}
.dm-g b{font-size:24px}
.dm-g .dm-k-sub{line-height:1.35}
.dm-g-leg{display:flex;justify-content:space-between;width:100%;font-size:10.5px;font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;gap:6px}
.dm-row.r2b{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.dm-row.r2b > .dm-card{display:flex;flex-direction:column}
.dm-row.r2b > .dm-card > .dm-box{flex:1;min-height:220px;height:auto}
.mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mc-head h3{margin:0;font-family:var(--font-display);font-size:16px;letter-spacing:.04em}
.mc-arr{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;transition:border-color .15s,background .15s}
.mc-arr:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.mcal{display:flex;flex-direction:column;gap:6px}
.mc-row{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr)) minmax(0,1.05fr);gap:6px}
.mc-top span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}
.mc-unit{display:flex;gap:2px;justify-content:center;padding:0 !important}
.mc-unit button{flex:1;border:0;border-radius:7px;padding:3px 0;font-size:10.5px;font-weight:800;background:var(--surface-2);color:var(--muted);transition:all .15s}
.mc-unit button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mc-d,.mc-w{position:relative;min-height:70px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .15s,box-shadow .15s}
.mc-n{position:absolute;top:5px;left:8px;font-size:11.5px;font-weight:700;color:var(--fg)}
.mc-d.out{background:transparent;border-color:color-mix(in srgb,var(--line) 60%,transparent)}
.mc-d.out .mc-n{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.mc-d b,.mc-w b{font-size:15px;font-weight:800;margin-top:10px;letter-spacing:-.01em}
.mc-d small,.mc-w small{font-size:10.5px;color:var(--muted)}
.mc-d.pos{background:color-mix(in srgb,var(--win) 16%,var(--bg));border-color:color-mix(in srgb,var(--win) 45%,var(--line))}
.mc-d.neg{background:color-mix(in srgb,var(--loss) 18%,var(--bg));border-color:color-mix(in srgb,var(--loss) 50%,var(--line))}
.mc-d.flat{background:var(--surface-2);border-color:var(--line-2)}
.mc-d.pos b,.mc-w.pos b{color:var(--win)} .mc-d.neg b,.mc-w.neg b{color:var(--loss)}
.mc-d.pos .mc-n{color:var(--win)} .mc-d.neg .mc-n{color:var(--loss)}
.mc-d:not(.out):not(:empty):hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(0,0,0,.6)}
.mc-ok{position:absolute;top:5px;right:6px;width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;font-size:9px;font-weight:800;display:grid;place-items:center;opacity:.8}
.mc-d.pos .mc-ok{color:var(--win)} .mc-d.neg .mc-ok{color:var(--loss)} .mc-d.flat .mc-ok{color:var(--muted)}
.mc-w{background:var(--surface-2);border-left-width:3px}
.mc-w .mc-n{color:var(--muted)}
.mc-w.pos{border-color:color-mix(in srgb,var(--win) 35%,var(--line));border-left-color:var(--win);background:color-mix(in srgb,var(--win) 9%,var(--surface-2))}
.mc-w.neg{border-color:color-mix(in srgb,var(--loss) 35%,var(--line));border-left-color:var(--loss);background:color-mix(in srgb,var(--loss) 9%,var(--surface-2))}
.mc-d.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset,0 0 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.mc-d.today .mc-n{color:var(--accent)}
.dm-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mc-foot{margin:12px 0 0;font-size:12.5px;color:var(--muted);text-align:right}
.m-phone .dm-row.r2b{grid-template-columns:1fr}
.m-phone .mc-d,.m-phone .mc-w{min-height:56px;padding:4px}
.m-phone .mc-d b,.m-phone .mc-w b{font-size:11.5px}
.m-phone .mc-d small,.m-phone .mc-w small{display:none}
.m-phone .dm-g{grid-column:span 2}
.dm-donut{position:relative;width:104px;height:104px;flex:none}
.dm-donut.lg{width:116px;height:116px}
.dm-scope{color:var(--accent);font-weight:700}
.dm-donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dm-donut-c b{font-size:21px;font-weight:700}
.dm-donut.lg .dm-donut-c b{font-size:24px}
.dm-donut-c small{font-size:11px;color:var(--muted)}
.dm-wr-leg{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dm-wr-leg div{display:flex;align-items:center;gap:8px;padding-bottom:5px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.dm-wr-leg div:last-child{border-bottom:0}
.dm-wr-leg i,.dm-leg i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dm-wr-leg b{margin-left:auto;font-size:15px}
.dm-row{display:grid;gap:14px}
.dm-row.r2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.dm-row.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dm-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.dm-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.dm-card-head h3{margin:0;font-family:var(--font-display);font-size:15.5px}
.dm-card-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.dm-tog{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--bg);border:1px solid var(--line);flex:none}
.dm-tog button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;transition:all .15s}
.dm-tog button:hover{color:var(--fg)}
.dm-tog button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:0 0 0 1px var(--line-2) inset}
.dm-box{position:relative;height:280px}
.dm-box.sm{height:220px}
.dm-box.xs{height:150px}
.dm-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px}
.dm-empty span{font-size:26px}
.dm-split{display:flex;align-items:center;gap:14px}
.dm-leg{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12.5px}
.dm-leg > div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.dm-leg > div:last-child{border-bottom:0}
.dm-leg-n{display:flex;align-items:center;gap:6px;flex:1;min-width:0;line-height:1.25}
.dm-leg-c{color:var(--muted);font-size:12px;min-width:22px;text-align:right}
.dm-leg b{min-width:58px;text-align:right;font-size:12.5px;white-space:nowrap}
.dm-foot{display:none;margin:0;text-align:center;font-size:11.5px;color:var(--muted);opacity:.7}
.dm.snapping .dm-foot{display:block}
.dm-prog-txt{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.dm-prog-txt b{color:var(--fg)}
.dm-prog{display:inline-block;vertical-align:middle;margin-left:10px;width:90px;height:4px;border-radius:99px;background:color-mix(in srgb,var(--line) 80%,transparent);overflow:hidden}
.dm-prog span{display:block;height:100%;border-radius:99px;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent)}
.dm-spark{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin:0 6px}
.dm-spark canvas{width:100%;height:54px;display:block}
.dm-spark{flex:1;justify-content:center;min-width:60px;align-self:stretch}
.dm-spark b{font-size:15px;font-weight:700;white-space:nowrap}
.dm-spark-none{font-size:12.5px;color:var(--muted);font-style:italic}
.dm-k2{flex-direction:row;align-items:stretch;gap:14px}
.dm-k2 > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.dm-k2 small,.dm-k2 b{white-space:nowrap}
.dm-k2 > div:first-child b{font-size:24px}
.dm-k2 > div{flex:1}
.dm-k2 > div:last-child{justify-content:flex-start}
.dm-k2 > div:last-child .dm-k-top{min-height:28px}
.dm-k-sep{width:1px;align-self:stretch;background:var(--line)}
.dm-k2 .dm-k-rt{align-items:center;text-align:center}
.dm-k2 .dm-k-rt b{font-size:18px;font-weight:500;line-height:26.4px}
.dm-k2 > div:first-child b{line-height:26.4px}
.dm-prog-txt b{margin:0 1px}
.dm-legend{display:flex;gap:0;margin-top:4px}
.dm-lg{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);padding:2px 0;margin-right:10px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s,color .15s}
.dm-lg i{display:inline-block;width:16px;height:3px;border-radius:2px}
.dm-lg.w i{background:var(--fg)} .dm-lg.o i{background:var(--accent);height:2.5px}
.dm-lg:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.dm-lg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.dm-lg[aria-pressed="false"] i{background:var(--muted)}
.snap-prev{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.panel.small:has(.snap-prev){max-width:720px}
.cf-actions button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.cf-actions button.primary:hover{filter:brightness(1.08)}
@media (max-width:1250px){.m-desk .dm-hero{flex-wrap:wrap}.m-desk .dm-pick{margin-left:0;align-items:flex-start}}
.m-phone .dm-hero{flex-direction:column;align-items:stretch;padding:16px}
.m-phone .dm-title h1{font-size:28px}
.m-phone .dm-pick{align-items:stretch;margin:0}
.m-phone .dm-months{grid-template-columns:repeat(6,1fr)}
.m-phone .dm-months button{min-width:0}
.m-phone .dm-cam{position:absolute;top:14px;right:14px;width:42px;height:42px;font-size:19px}
.m-phone .dm-when{padding-right:50px}
.m-phone .dm-arrow{display:none}
.m-phone .dm-spark{margin:0}
.m-phone .dm-prog{width:100%}
.m-phone .dm-kpis{grid-template-columns:1fr 1fr}

.m-phone .dm-row.r2,.m-phone .dm-row.r3{grid-template-columns:1fr}
.m-phone .dm-box{height:240px}
/* ===== Vue d'ensemble ===== */
.ov{display:flex;flex-direction:column;gap:14px;animation:fiIn .35s cubic-bezier(.2,.8,.3,1)}
.ov-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ov-k{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ov-k small{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ov-k b{font-size:21px;font-weight:700;line-height:1.15}
.ov-k span{font-size:12px;color:var(--muted)}
.ov-card{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:18px 20px 14px}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ov-title{display:flex;align-items:baseline;gap:12px}
.ov-title h2{margin:0;font-family:var(--font-display);font-size:19px}
.ov-period{font-size:13px;color:var(--muted)}
.ov-sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ov-title h2{font-size:17px !important}
.ov-seg{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:var(--bg);border:1px solid var(--line);flex-wrap:wrap}
.ov-seg button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.ov-seg button:hover:not(:disabled){color:var(--fg);background:var(--surface-2)}
.ov-seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ov-seg button:disabled{opacity:.35;cursor:default}
.ov-ranges{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
.ov-dates{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ov-dates .field{padding:7px 10px;width:auto}
.ov-hint{font-size:12px;color:var(--muted)}
.ov-unzoom{border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--fg);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600}
.ov-unzoom:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ov-ddtog{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}
.ov-chart{position:relative;height:min(46vh,440px);min-height:300px;margin-top:6px;cursor:crosshair;user-select:none}
.ov-sel{position:absolute;display:none;background:color-mix(in srgb,var(--accent) 16%,transparent);border-left:1px solid var(--accent);border-right:1px solid var(--accent);pointer-events:none}
.ov-sel.on{display:block}
.ov-dd{position:relative;height:96px;margin-top:2px}
.ov-empty{height:100%;display:grid;place-items:center;color:var(--muted)}
.ov-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.ov-legend .lg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.lg.dep{background:var(--dep)} .lg.ret{background:var(--ret)}
.m-phone .ov-kpis{grid-template-columns:1fr 1fr}
.m-phone .ov-k:first-child{grid-column:1 / -1}
.m-phone .ov-card{padding:14px 12px}
.m-phone .ov-chart{height:300px}
.m-phone .ov-hint{display:none}
/* ===== the trade page ===== */
.fi{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;animation:fiIn .35s cubic-bezier(.2,.8,.3,1)}
@keyframes fiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fi-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fi-back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 13px 8px 10px;font-weight:600;font-size:13.5px;transition:border-color .15s,background .15s,transform .12s}
.fi-back:hover{border-color:var(--line-2);background:var(--surface-2)}
.fi-back:hover svg{transform:translateX(-2px)}
.fi-back svg{transition:transform .15s}
.fi-nav{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.fi-nav-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;transition:all .15s}
.fi-nav-btn:hover:not(:disabled){color:var(--fg);border-color:var(--line-2)}
.fi-nav-btn:disabled{opacity:.3;cursor:default}
.fi-save{margin-left:auto;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;opacity:0;transition:opacity .25s}
.fi-save.on{opacity:1}
.fi-save.ok{color:var(--win)} .fi-save.err{color:var(--loss)}
.fi-acts{display:flex;gap:8px;align-items:center}
.fi-acts .ghost{padding:8px 13px}
.fi-acts .jt-close{padding:9px 14px;font-size:12.5px}
.fi-del:hover{border-color:color-mix(in srgb,var(--loss) 55%,var(--line));background:var(--loss-soft)}
.fi-save:not(.on) + .fi-acts,.fi-top > .fi-acts:first-of-type{margin-left:auto}
.fi-save.on + .fi-acts{margin-left:0}
.fi-hero{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:center;padding:20px 22px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,var(--surface)),var(--surface) 55%);border:1px solid var(--line)}
.fi-hero.is-open{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.fi-cls{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 32%,transparent)}
.fi-asset{display:flex;align-items:center;gap:12px}
.fi-asset h2{margin:0;font-family:var(--font-display);font-size:28px;letter-spacing:.01em}
.fi-asset .jt-side{font-size:14px}
.fi-date{margin-top:3px;color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fi-date .jt-dot{margin:0}
.fi-res{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.fi-res b{font-size:28px;font-weight:700;font-family:var(--font-num);line-height:1.1}
.fi-res > span.num{font-size:12.5px;color:var(--muted)}
.fi-chips{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.fi-chip{display:flex;flex-direction:column;gap:4px;padding:8px 13px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);min-width:96px}
.fi-chip small{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fi-chip span{font-size:13.5px;font-weight:600}
.fi-chip em{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px}
.fi-stars{color:#f5b301;letter-spacing:1px}
.fi-stars i{font-style:normal;color:var(--line-2)}
.fi-card{border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:16px 18px}
.fi-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fi-card-head h3{margin:0;font-family:var(--font-display);font-size:16px}
.fi-count{font-size:12.5px;color:var(--muted);font-weight:600}
.fi-pics{transition:border-color .2s,background .2s}
.fi-pics.drag{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.fi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fi-img{position:relative;margin:0;aspect-ratio:16 / 10;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);cursor:zoom-in}
.fi-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.fi-img:hover img{transform:scale(1.03)}
.fi-img.broken{cursor:default}
.fi-img.broken::after{content:"Image introuvable";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.fi-img.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:default;color:var(--muted)}
.fi-img-del{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s}
.fi-img:hover .fi-img-del,.m-phone .fi-img-del{opacity:1}
.fi-img-del:hover{background:var(--loss)}
.fi-add{aspect-ratio:16 / 10;border-radius:12px;border:1.5px dashed var(--line-2);background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;transition:border-color .15s,color .15s,background .15s}
.fi-add:hover{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.fi-add-ico{font-size:24px;line-height:1;color:var(--accent)}
.fi-add b{font-size:13.5px}
.fi-add small{font-size:11.5px;line-height:1.4}
.fi-empty{color:var(--muted);margin:0}
.fi-lost{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line));font-size:13.5px}
.fi-lost .primary{padding:8px 14px;font-size:13px}
.fi-spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:spin .7s linear infinite}
.fi-spin.sm{width:12px;height:12px;border-width:2px}
.fi-text{width:100%;box-sizing:border-box;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:11px;padding:12px 14px;font:inherit;font-size:14px;line-height:1.6;min-height:140px;transition:border-color .15s,box-shadow .15s;overflow:hidden}
.fi-text:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.fi-text[readonly]{background:var(--surface-2)}
.fi-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fi-note.pos{border-top:3px solid var(--win)}
.fi-note.neg{border-top:3px solid var(--loss)}
.fi-note.pos .fi-text:focus{border-color:var(--win);box-shadow:0 0 0 3px color-mix(in srgb,var(--win) 16%,transparent)}
.fi-note.neg .fi-text:focus{border-color:var(--loss);box-shadow:0 0 0 3px color-mix(in srgb,var(--loss) 16%,transparent)}
.fi-foot{margin:0 0 20px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fi-bar{display:inline-block;width:120px;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fi-bar span{display:block;height:100%;background:var(--accent);min-width:2px}
.m-phone .fi-hero{grid-template-columns:auto 1fr;padding:16px}
.m-phone .fi-res{grid-column:1 / -1;align-items:flex-start;flex-direction:row;flex-wrap:wrap;gap:8px 12px;align-items:center}
.m-phone .fi-asset h2{font-size:22px}
.m-phone .fi-cls{width:46px;height:46px;font-size:24px}
.m-phone .fi-two{grid-template-columns:1fr}
.m-phone .fi-grid{grid-template-columns:1fr 1fr}
.m-phone .fi-save{order:5;margin-left:0;flex-basis:100%}
/* full screen viewer */
.vw{position:fixed;inset:0;z-index:80;background:rgba(3,5,10,.92);display:grid;place-items:center;padding:40px;animation:fadein .18s ease-out}
.vw img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:vwIn .25s cubic-bezier(.2,.8,.3,1)}
@keyframes vwIn{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.vw-x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:11px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:17px;transition:background .15s}
.vw-x:hover{background:var(--loss)}
.vw-arr{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:34px;line-height:1;transition:background .15s}
.vw-arr:hover{background:rgba(255,255,255,.18)}
.vw-arr.l{left:16px} .vw-arr.r{right:16px}
.vw-n{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:4px 11px;border-radius:99px}
/* import window */
.panel.imp{max-width:560px}
.imp-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imp-box{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.imp-box b{font-size:21px;font-weight:700}
.imp-box small{font-size:11.5px;color:var(--muted)}
.imp-box.ok{border-color:color-mix(in srgb,var(--win) 45%,var(--line));background:color-mix(in srgb,var(--win) 8%,var(--surface-2))}
.imp-box.ok b{color:var(--win)}
.imp-span{margin:10px 0 0;font-size:13px;color:var(--muted);text-transform:none}
.imp-span::first-letter{text-transform:uppercase}
.imp-warn,.imp-fail{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 40%,var(--line))}
.imp-fail{margin:14px 0 16px;border-style:solid;border-color:color-mix(in srgb,var(--loss) 45%,var(--line));background:var(--loss-soft)}
.imp-bad{margin-top:10px;font-size:13px;color:var(--muted)}
.imp-bad summary{cursor:pointer;font-weight:600}
.imp-bad ul{margin:6px 0 0;padding-left:18px;max-height:120px;overflow:auto}
.imp-prev{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.imp-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);font-size:13px}
.imp-row:last-child{border-bottom:0}
.imp-row .jt-cls{width:24px;height:24px;font-size:13px;border-radius:7px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent)}
.imp-d{color:var(--muted);margin-left:auto}
.imp-v{min-width:92px;text-align:right;font-weight:700}
.imp-more{margin:0;padding:7px 12px;font-size:12px;color:var(--muted);background:var(--surface-2)}
.imp-save:disabled{opacity:.55}
/* closing window */
.panel.tr.tr-close{max-width:600px}
.cl-sum{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:2px;align-items:center;padding:12px 14px !important;margin-top:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.cl-sum .jt-cls{grid-row:1 / 3;width:38px;height:38px;font-size:19px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.cl-main{display:flex;align-items:center;gap:10px}
.cl-main b{font-size:17px;letter-spacing:.02em}
.cl-meta{font-size:12.5px;color:var(--muted)}
.tr-close .row3{margin-top:2px}
.jt-wd{color:var(--fg);font-weight:600;margin-right:4px}
.jt td.jt-date{white-space:normal;min-width:11.5em;line-height:1.35}
.jt-date .jd,.jt-date .jt-wd,.jt-date .jt-time{white-space:nowrap}
.jt-date .jd{font-weight:600}
.jt-time{color:var(--muted);margin-left:0;font-size:12px;font-variant-numeric:tabular-nums}
.jt-acc{color:var(--fg);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.jt-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
.jt-asset{display:flex;align-items:center;gap:8px}
.jt-asset b{font-weight:700;letter-spacing:.02em}
.jt-cls{flex:none;width:25px;height:25px;font-size:14px !important;border-radius:8px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.jt-side{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600}
.jt-side .arw{font-size:9px}
.jt-side.long{color:var(--win)}
.jt-side.short{color:var(--loss)}
.jt-sess{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px 4px 6px;border-radius:999px;color:var(--fg);background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}
.jt-risk{min-width:96px}
.jr-v{display:grid;grid-template-columns:calc(var(--rw,8ch) * .92) 1px auto;align-items:center;gap:7px;font-size:12.5px}
.jr-v > span:first-child{text-align:right}
.jr-v i{width:1px;height:13px;background:var(--line-2)}
.jr-r{color:var(--muted)}
.jr-bar{margin-top:6px;height:3px;width:100%;max-width:104px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.jr-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,transparent),var(--accent))}
.jr-bar.over span{background:var(--loss)}
.jt-res{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px 5px 9px;border-radius:8px;letter-spacing:.01em}
.jt-res::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.jt-res.win{color:var(--win);background:var(--win-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--win) 40%,transparent)}
.jt-res.loss{color:var(--loss);background:var(--loss-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--loss) 40%,transparent)}
.jt-res.be{color:var(--muted);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.jt-res.open{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.jt-res.open::before{display:none}
.jt-net{font-weight:700;font-size:13.5px}
.jt-rr{font-weight:700}
.jt-na{color:var(--muted);font-weight:400}
th.jt-acts,td.jt-acts{width:1%;text-align:right;padding-right:10px !important;position:sticky;right:0;z-index:1;background:var(--surface)}
.jt-card.scrolls td.jt-acts,.jt-card.scrolls th.jt-acts{box-shadow:-10px 0 14px -10px rgba(0,0,0,.55)}
.jt thead th.jt-acts{z-index:3;background:color-mix(in srgb,var(--surface-2) 75%,var(--surface))}
.jt tr.is-open td.jt-acts{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.jt tr.row:hover td.jt-acts{background:color-mix(in srgb,var(--surface-2) 80%,var(--surface))}
.jt tr.is-open:hover td.jt-acts{background:color-mix(in srgb,var(--accent) 12%,var(--surface)) !important}
.jt-acts{white-space:nowrap}
.jt-btn{width:28px;height:28px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);display:inline-grid;place-items:center;margin-left:2px;opacity:.55;transition:opacity .15s,background .15s,color .15s,border-color .15s,transform .12s;vertical-align:middle}
.jt-btn svg{width:16px;height:16px}
.jt tr.row:hover .jt-btn{opacity:1}
.jt-btn:hover{background:var(--surface-2);border-color:var(--line);color:var(--fg)}
.jt-btn.jt-del:hover{background:var(--loss-soft);border-color:color-mix(in srgb,var(--loss) 45%,var(--line));color:var(--loss)}
.jt-btn.soon{opacity:.3}
.jt tr.row:hover .jt-btn.soon{opacity:.5}
.jt-btn:active{transform:scale(.9)}
.jt-close{border:0;border-radius:8px;padding:7px 8px;margin-right:0;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);vertical-align:middle;transition:filter .15s,transform .15s,box-shadow .15s}
.jt-close:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.jt-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 0;color:var(--muted)}
.jt-empty span{font-size:28px}
.tip.up{transform:translate(-50%,-100%)}
table.tx-table{width:100%;border-collapse:collapse;font-size:13px}
table.journal{min-width:1380px}
.tx-table th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tx-table th.r,.tx-table td.r{text-align:right}
.tx-table td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tx-table td + td,.tx-table th + th{border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.tx-table tbody tr.row{cursor:pointer}
.tx-table tbody tr.row:hover td{background:var(--surface-2)}
.tx-table .note{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tx-table .asset{font-weight:700;font-family:var(--font-num)}
.month-row td{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:7px 10px}
.month-row td span{float:right;text-transform:none;letter-spacing:0}
tr.quick td{background:color-mix(in srgb,var(--accent) 6%,var(--surface));padding:6px 4px;border-bottom:2px solid var(--accent);position:sticky;top:33px;z-index:1}
tr.quick td:first-child{padding-left:8px}
tr.quick td:last-child{padding-right:8px}
.qf{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 7px;outline:none;min-width:0;font-size:13px}
.qf:focus{border-color:var(--accent)}
.qf.n{text-align:right;font-family:var(--font-num)}
.q-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:7px;padding:6px 12px;white-space:nowrap}
.q-hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.q-err{color:var(--loss);font-weight:600}

/* ===== PHONE MODE ===== */
.ptop{display:none}
.m-phone .ptop{display:block;position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ptop-inner{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptop .brand{font-size:15px}
.ptop .mode-switch button{padding:6px 8px}
.ptop .mode-switch button span{display:none}
.m-phone .wrap{max-width:520px;margin:0 auto;padding-inline:14px;padding-block:14px 120px}
.m-phone .page-head{margin-bottom:12px}
.m-phone .page-head h1{font-size:22px}
.m-phone .page-head h1 small{display:none}
.m-phone .filters{width:100%}
.m-phone .filters .select{flex:1 1 140px}
.m-phone .kpis{grid-template-columns:1fr 1fr}
.m-phone .kpi.hero{grid-column:1/-1}
.m-phone .kpis .kpi:last-child{grid-column:1/-1}
.m-phone .kpi.hero .k-val{font-size:30px}
.m-phone .kpi .k-val{font-size:20px}
.m-phone .grid{grid-template-columns:minmax(0,1fr)}
.m-phone .desk-only{display:none !important}
.m-desk .phone-only{display:none !important}
.m-phone .cal .cell{min-height:46px;padding:4px}
.m-phone .cal .cell .n{display:none}
.m-phone .cal .cell .v{font-size:10px}
.m-phone .brk-row{grid-template-columns:minmax(0,1fr) 34px 44px minmax(0,1fr) 78px;gap:7px;font-size:12.5px}

.day{margin-top:14px}
.day-head{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:0 4px 6px}
.day-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:10px 13px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface-2)}
.grow{flex:1;min-width:0}
.t-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.t-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-amt{text-align:right;white-space:nowrap}
.t-amt div:first-child{font-weight:700}
.t-amt div:last-child{font-size:12px}

.mnav{display:none}
.m-phone .mnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.mnav-inner{max-width:520px;margin:0 auto;padding-inline:8px;display:flex;justify-content:space-between;align-items:center}
.mtab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);width:68px}
.mtab[aria-selected="true"]{color:var(--accent)}
.mtab svg{width:22px;height:22px}
.fab{border:0;width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow)}

/* more menu (phone) and account cards */
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list button{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:600;text-align:left}
.menu-list button svg{width:20px;height:20px;color:var(--muted)}
.acc-cards{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.acc-cards .acc-card{flex:0 1 400px;min-width:330px}
.m-phone .acc-cards .acc-card{flex:1 1 100%;min-width:0}
.acc-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.acc-card.archived{opacity:.6}
.acc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acc-name{font-family:var(--font-display);font-weight:700;font-size:17px}
.acc-broker{font-size:12.5px;color:var(--muted)}
.acc-bal{font-family:var(--font-num);font-weight:700;font-size:24px}
.acc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acc-grid div{background:var(--surface-2);border-radius:8px;padding:7px 9px;min-width:0}
.acc-grid span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.acc-grid strong{font-family:var(--font-num);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.acc-actions{margin-top:auto;padding-top:4px;display:grid;grid-template-columns:auto 1fr auto 40px;gap:6px}
.acc-act{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 10px;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s,background .15s}
.acc-act:hover{border-color:var(--line-2);background:color-mix(in srgb,var(--fg) 6%,var(--surface-2))}
.acc-act.del{padding:9px 0;font-size:14px}
.acc-act.del:hover{border-color:color-mix(in srgb,var(--loss) 60%,var(--line));background:var(--loss-soft)}
.acc-add-cell{display:flex;align-items:flex-start;padding:14px 4px;flex:none}
.acc-add{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s,filter .15s}
.acc-add:hover{transform:scale(1.07);filter:brightness(1.05)}
.acc-add svg{width:22px;height:22px}
/* deposit / withdrawal window */
.panel.mov{max-width:500px;border:1.5px solid var(--mv,var(--line));transition:border-color .25s,box-shadow .25s;box-shadow:var(--shadow),0 0 0 4px color-mix(in srgb,var(--mv) 12%,transparent)}
.panel.mv-dep{--mv:var(--dep)}
.panel.mv-ret{--mv:var(--ret)}
.mv-head{margin-bottom:12px}
.mv-title{display:flex;align-items:center;gap:10px}
.mv-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--mv) 16%,transparent);transition:background .25s}
.mv-acc{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.mv-bal{font-weight:700;font-size:14px}
